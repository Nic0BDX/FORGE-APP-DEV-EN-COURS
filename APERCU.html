<style>/* FORGE — Variables, reset et composants de base */
:root{
  --bg:#050607;--bg2:#090b0d;--panel:#0d0f11;--panel2:#14171a;--line:#24282d;
  --text:#f7f8f8;--muted:#8b9198;--accent:#f4f5f5;--accent2:#6ee7a0;--blue:#5b8cff;
  --warn:#ffc857;--danger:#ff6262;--shadow:0 18px 60px rgba(0,0,0,.28);
  --r:18px;--r2:12px;font-synthesis:none;
}
:root.light{--bg:#f4f6f8;--bg2:#fff;--panel:#fff;--panel2:#eef1f5;--line:#dce2e9;--text:#14171d;--muted:#697386;--shadow:0 12px 35px rgba(15,23,42,.08)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px)}
.logo{font-weight:950;letter-spacing:.18em;font-size:20px}.logo span{color:var(--text)}
.top-actions{display:flex;gap:8px}
.icon{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text)}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 69px)}
.side{border-right:1px solid var(--line);padding:18px;position:sticky;top:69px;height:calc(100vh - 69px);background:color-mix(in srgb,var(--bg) 94%,transparent)}
.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:var(--muted);padding:12px 13px;border-radius:12px;text-align:left;font-weight:700}.nav button.active,.nav button:hover{background:var(--panel2);color:var(--text)}.nav button.active{box-shadow:inset 3px 0 var(--accent)}
.main{max-width:1250px;width:100%;padding:28px 28px 100px;margin:auto}
.mobile-nav{display:none}
h1{font-size:30px;line-height:1.1;margin:0 0 6px;font-weight:900;letter-spacing:-.03em}h2{font-size:21px;margin:0 0 12px}h3{font-size:16px;margin:0 0 5px}.sub{color:var(--muted)}.eyebrow{color:var(--accent);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.14em}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:linear-gradient(145deg,var(--panel),color-mix(in srgb,var(--panel) 80%,var(--bg2)));border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.hero{padding:25px;background:linear-gradient(135deg,rgba(255,91,50,.16),rgba(91,140,255,.08) 60%,var(--panel));}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.wrap{flex-wrap:wrap}.gap{gap:8px}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:800;color:var(--text);background:var(--panel2);border:1px solid var(--line)}.btn:hover{filter:brightness(1.08)}.primary{background:#f5f6f6;border-color:#f5f6f6;color:#08090a}.success{background:var(--accent2);border-color:var(--accent2);color:#06140b}.danger{color:#fff;background:var(--danger);border-color:var(--danger)}.ghost{background:transparent}.small{padding:8px 10px;font-size:12px}.wide{width:100%}
.stat{padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--panel2)}.stat b{display:block;font-size:24px;margin-top:2px}.stat small{color:var(--muted)}
.progress{height:9px;background:var(--panel2);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,#dfe3e5,#ffffff);border-radius:inherit}.progress.green>i{background:linear-gradient(90deg,var(--accent2),#70e6c5)}.progress.blue>i{background:linear-gradient(90deg,var(--blue),#8caeff)}
.kpi{font-size:27px;font-weight:900}.xp{color:var(--accent2);font-weight:900}
.list{display:grid;gap:8px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
input,select,textarea{width:100%;padding:11px 12px;margin-top:6px;margin-bottom:11px;background:var(--bg2);color:var(--text);border:1px solid var(--line);border-radius:11px;outline:none}textarea{min-height:100px;resize:vertical}label{font-size:12px;color:var(--muted);font-weight:700}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted)}
.check{width:21px;height:21px;margin:0}.pill{padding:4px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:12px}.pill.orange{color:#ff9b80;border-color:#6b3225}.pill.green{color:#7ce8ca}.pill.blue{color:#9db8ff}
.empty{text-align:center;padding:35px;color:var(--muted)}
.toast{position:fixed;right:20px;bottom:20px;z-index:100;background:var(--panel);border:1px solid var(--line);padding:14px 16px;border-radius:14px;box-shadow:var(--shadow);display:none}.toast.show{display:block;animation:pop .18s ease}@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:80;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modalbox{width:min(680px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}
canvas{width:100%;height:220px;display:block}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:52px;border:1px solid var(--line);border-radius:9px;padding:6px;background:var(--panel2);font-size:12px}.day.done{outline:2px solid rgba(69,214,174,.5)}.day.today{outline:2px solid var(--accent)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.badge{padding:13px;text-align:center;border:1px solid var(--line);border-radius:14px;background:var(--panel2)}.badge.lock{opacity:.32;filter:grayscale(1)}.badge .ico{font-size:25px}
.session-sticky{position:sticky;top:70px;z-index:10;background:var(--bg);padding-bottom:10px}
.timer{font-size:28px;font-weight:900;letter-spacing:.03em}
.foodrow{display:grid;grid-template-columns:1.5fr .6fr .6fr auto;gap:7px;align-items:end}
.setup{min-height:100vh;display:grid;place-items:center;padding:25px}.setupbox{width:min(600px,100%)}
.avatar{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,var(--accent),#ff9d64);display:grid;place-items:center;font-size:30px;font-weight:900;color:#fff}
@media(max-width:850px){.shell{display:block}.side{display:none}.main{padding:20px 14px 95px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;padding:8px 7px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line)}.mobile-nav button{flex:1;background:none;border:0;color:var(--muted);font-size:11px;padding:6px}.mobile-nav button.active{color:var(--accent)}.g2,.g3,.g4{grid-template-columns:1fr}.badges{grid-template-columns:repeat(2,1fr)}.foodrow{grid-template-columns:1fr 1fr}.foodrow button{grid-column:1/-1}.top{padding:12px 14px}.hero{padding:20px}}

.auth-visual:after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,91,50,.12),transparent 55%)}
.auth-brand{position:absolute;top:32px;left:38px;z-index:2;font-weight:950;font-size:25px;letter-spacing:.18em}.auth-brand span{color:var(--accent)}
.auth-copy{position:relative;z-index:2}.auth-copy h1{font-size:48px;max-width:520px}.auth-copy p{max-width:470px;color:#c5cad3;font-size:16px}
.auth-form{padding:42px;display:flex;align-items:center}.auth-inner{width:100%;max-width:410px;margin:auto}.auth-tabs{display:flex;gap:5px;padding:5px;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:14px;margin-bottom:28px}.auth-tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:11px;border-radius:10px;font-weight:850}.auth-tabs button.active{background:var(--panel2);color:var(--text);box-shadow:0 4px 20px rgba(0,0,0,.2)}
.auth-title{font-size:31px;font-weight:950;letter-spacing:-.04em;margin-bottom:5px}.auth-sub{color:var(--muted);margin-bottom:22px}.auth-form input{margin-bottom:13px}.password-wrap{position:relative}.password-wrap input{padding-right:50px}.eye{position:absolute;right:8px;top:8px;width:38px;height:38px;border:0;border-radius:9px;background:transparent;color:var(--muted)}.auth-error{min-height:22px;color:#ff8e8e;font-size:13px;font-weight:700}.avatar-picker{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:8px 0 18px}.avatar-option{height:82px;border-radius:15px;border:2px solid var(--line);background-size:cover;background-position:center;position:relative;overflow:hidden}.avatar-option.selected{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,91,50,.18)}.avatar-option:after{content:'';position:absolute;inset:auto 0 0;height:38%;background:linear-gradient(transparent,rgba(0,0,0,.55))}

<style>/* FORGE — Accueil premium */
/* ===== FORGE PREMIUM HOME ===== */
@keyframes forgeRise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes forgeGlow{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.9;transform:scale(1.08)}}
@keyframes forgeShine{from{transform:translateX(-120%)}to{transform:translateX(140%)}}
@keyframes forgePulse{0%,100%{box-shadow:0 0 0 0 rgba(255,91,50,.18)}50%{box-shadow:0 0 0 9px rgba(255,91,50,0)}}
.home-page{position:relative;animation:forgeRise .55s cubic-bezier(.2,.8,.2,1) both}
.home-page:before{content:'';position:absolute;width:520px;height:360px;right:-190px;top:-150px;background:radial-gradient(circle,rgba(255,91,50,.15),transparent 68%);filter:blur(10px);pointer-events:none;animation:forgeGlow 7s ease-in-out infinite}
.home-head{position:relative;z-index:1;margin-bottom:18px}.home-head h1{font-size:clamp(32px,4vw,48px);letter-spacing:-.055em}.home-date{font-size:11px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.home-chip{display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border:1px solid rgba(255,91,50,.25);border-radius:999px;background:rgba(255,91,50,.08);font-weight:850;box-shadow:inset 0 1px rgba(255,255,255,.04)}
.home-hero{position:relative;overflow:hidden;min-height:245px;padding:28px!important;border-radius:26px!important;border-color:rgba(255,255,255,.10)!important;background:radial-gradient(600px 240px at 90% 0%,rgba(91,140,255,.16),transparent 65%),radial-gradient(480px 280px at 5% 100%,rgba(255,91,50,.16),transparent 65%),linear-gradient(145deg,#171b24,#10131a)!important;box-shadow:0 24px 80px rgba(0,0,0,.30),inset 0 1px rgba(255,255,255,.05)!important}
.home-hero:after{content:'';position:absolute;inset:-40% auto auto -10%;width:40%;height:180%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);transform:rotate(18deg);animation:forgeShine 7s ease-in-out infinite}
.hero-orb{position:absolute;right:8%;top:24px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.18),rgba(255,91,50,.08) 30%,transparent 68%);border:1px solid rgba(255,255,255,.08);box-shadow:0 0 80px rgba(255,91,50,.13);animation:forgeGlow 5s ease-in-out infinite}
.hero-orb:before{content:'⚡';position:absolute;inset:0;display:grid;place-items:center;font-size:64px;filter:drop-shadow(0 0 22px rgba(255,91,50,.55))}.hero-copy{position:relative;z-index:2;max-width:620px}.hero-copy h2{font-size:clamp(26px,3vw,40px);letter-spacing:-.045em;margin:8px 0}.hero-copy p{color:#aab3c2;max-width:520px;font-size:15px}

 .mobile-nav{display:flex!important;position:fixed;z-index:60;left:0;right:0;bottom:0;max-width:none;margin:0;padding:8px 12px calc(10px + var(--safe-b));gap:3px;border-radius:22px 22px 0 0!important;border:1px solid var(--line)!important;border-bottom:0!important;background:var(--panel)!important;box-shadow:0 -5px 25px rgba(25,48,31,.035)}

 .mobile-nav button.active svg{color:var(--accent)}
 .is-session .mobile-nav{display:none!important}
}

.fresh .main{animation:pagein .25s ease both}

/* Bienvenue et compte. */
.ea{position:relative;min-height:100dvh;display:grid;grid-template-rows:1fr auto;overflow:hidden;background:var(--bg)}
.ea-photo{position:absolute;top:94px;left:20px;right:20px;height:clamp(220px,33dvh,380px);border-radius:24px;overflow:hidden}
.ea-photo:after{display:none}.ea-glow{display:none}
.ea-copy{position:relative;z-index:3;align-self:end;padding:calc(clamp(220px,33dvh,380px) + 124px + var(--safe-t)) 25px 24px;pointer-events:none}
.ea-brand{position:absolute;left:25px;top:calc(30px + var(--safe-t));font-weight:750;font-size:25px;letter-spacing:.17em;line-height:1.1;color:var(--text)}
.ea-brand small{display:block;font-size:10px;font-weight:500;letter-spacing:.06em;color:var(--muted);margin-top:6px}
.ea-title{margin:0 0 12px;font-size:clamp(31px,8.3vw,43px);font-weight:600;letter-spacing:-.045em;line-height:1.13;max-width:14ch}
.ea-lead{margin:0;color:var(--muted);font-size:14px;max-width:36ch;line-height:1.65}
.ea-panel{position:relative;z-index:3;padding:0 24px calc(26px + var(--safe-b));max-width:560px;width:100%;margin:0 auto}
.ea-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:13px 18px;border-radius:15px;font-weight:650;font-size:15px;line-height:1.4;border:1px solid var(--line);color:var(--text)}
.ea-btn.light,.ea-btn.red{background:var(--primary);color:var(--on-primary);border-color:transparent;box-shadow:none}
.ea-btn.dark{background:transparent;margin-top:10px;color:var(--text)}
.ea-form{display:none}
.ea[data-step=form] .ea-actions,.ea[data-step=form] .ea-copy{display:none}
.ea[data-step=form] .ea-form{display:block}
.ea[data-step=form] .ea-photo{display:none}
.ea[data-step=form]{grid-template-rows:auto 1fr}
.ea[data-step=form] .ea-panel{align-self:center;padding:calc(24px + var(--safe-t)) 24px calc(32px + var(--safe-b));background:var(--bg);max-width:500px}
.ea-back{display:flex;align-items:center;gap:7px;background:none;border:0;color:var(--muted);font-weight:550;padding:10px 0;min-height:44px;margin-bottom:12px}
.ea-form-brand{font-weight:700;letter-spacing:.16em;font-size:20px;margin:2px 0 22px}
.ea-tabs{display:flex;gap:4px;padding:5px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);margin:6px 0 26px}
.ea-tabs button{flex:1;border:0;background:none;color:var(--muted);padding:10px 8px;min-height:44px;border-radius:10px;font-weight:600;font-size:14px}
.ea-tabs button.active{background:var(--panel);color:var(--text);box-shadow:0 2px 5px rgba(25,45,25,.06)}
.ea-h{font-size:28px;font-weight:600;letter-spacing:-.035em;line-height:1.2;margin:0 0 8px}
.ea-sub{color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:24px}
.ea-form label{display:block;margin-top:3px}
.ea-form input{margin-bottom:16px;min-height:50px;background:var(--panel)}
.ea-form .auth-error{min-height:20px;margin-bottom:8px;color:var(--danger)}
.ea-form .auth-meta{margin-top:18px;gap:12px;flex-wrap:wrap;font-size:12px;line-height:1.6}
.ea-form .security-note{background:var(--panel2);border-radius:12px;line-height:1.65;font-size:12px;padding:13px}
.ea-form .avatar-option.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--soft)}
.auth-link{color:var(--accent);font-weight:600;display:inline-flex;align-items:center;min-height:44px}
.eye{width:44px;height:44px;top:9px;right:5px;color:var(--muted)}
.face-modal{background:color-mix(in srgb,var(--bg) 92%,transparent)}
.face-scan:before{border-color:var(--line);border-top-color:var(--accent)}
.face-icon{border-color:var(--line);background:var(--soft);color:var(--accent);box-shadow:none}
.face-sub{color:var(--muted)}
@media(min-width:901px){
 .ea,.ea[data-step=form]{grid-template-columns:minmax(0,1.05fr) minmax(400px,.95fr);grid-template-rows:1fr}
 .ea-photo,.ea[data-step=form] .ea-photo{display:block;left:28px;right:50%;top:28px;bottom:28px;height:auto;border-radius:28px}
 .ea-photo:after{display:block;content:'';position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,transparent 30%,rgba(20,50,33,.2) 50%,rgba(20,50,33,.9))}
 .ea-copy,.ea[data-step=form] .ea-copy{display:block;grid-area:1/1;padding:60px 60px 84px;color:var(--on-hero);align-self:end}
 .ea-brand{position:fixed;top:64px;left:65px;color:var(--on-hero);font-size:27px}
 .ea-brand small{color:#d4dec5}
 .ea-title{font-size:clamp(36px,4vw,58px);max-width:13ch}
 .ea-lead{color:#e0e6d7;font-size:16px;max-width:37ch}
 .ea-panel,.ea[data-step=form] .ea-panel{grid-area:1/2;display:flex;flex-direction:column;justify-content:center;background:var(--bg);border:0;padding:52px 46px;max-width:none;min-height:100dvh}
 .ea-actions,.ea[data-step=form] .ea-actions{display:none}.ea-form,.ea[data-step=form] .ea-form{display:block;width:100%;max-width:380px;margin:0 auto}
 .ea-back{display:none}.ea-form-brand{display:none}
}

/* Tableau d'accueil — les contenus sont conservés, la hiérarchie respire. */
.eh{max-width:1120px;margin:0 auto;display:grid;gap:18px;grid-template-columns:repeat(12,minmax(0,1fr))}
.eh>*{grid-column:1/-1;min-width:0}
.eh-head{display:flex;align-items:center;gap:11px;margin-bottom:6px}
.eh-avatar{width:46px;height:46px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);background-size:cover;background-position:center;flex:none;padding:0}
.eh-hello{flex:1;min-width:0}.eh-hello small{display:block;color:var(--muted);font-size:12px;line-height:1.5}.eh-hello b{display:block;font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.04em}
.eh-chip{display:inline-flex;align-items:center;gap:5px;height:38px;padding:0 10px;border-radius:12px;background:var(--soft);border:0;font-weight:600;font-size:12px;color:var(--accent)}
.eh-chip svg{color:var(--accent)}.eh-elite{background:transparent;border:1px solid var(--line);font-size:11px}
.eh-hero{position:relative;min-height:290px;border-radius:24px;overflow:hidden;border:0;isolation:isolate;display:flex;align-items:flex-end;background:var(--hero);color:var(--on-hero);box-shadow:none}
.eh-hero .ph:after{content:'';position:absolute;inset:0;z-index:2;background:linear-gradient(90deg,rgba(25,62,43,.88),rgba(25,62,43,.2))}
.eh-hero-body{position:relative;z-index:3;padding:26px;width:100%}
.eh-hero small{color:#d3e0be;font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.eh-hero h2{font-size:clamp(29px,7.5vw,40px);font-weight:600;margin:10px 0 15px;letter-spacing:-.04em;line-height:1.1;max-width:15ch}
.eh-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.eh-tags span{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:450;color:#edf1df}
.eh-tags span+span{border-left:1px solid rgba(235,242,222,.4);padding-left:10px}
.eh-go{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:50px;padding:12px 17px;border-radius:13px;border:0;font-weight:650;font-size:14px;background:#e1e9c9;color:#234c3e;box-shadow:none}
.eh-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.eh-kpi{padding:17px;border-radius:18px;background:var(--panel);border:1px solid var(--line);min-width:0}
.eh-kpi small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.eh-kpi b{display:block;font-size:26px;font-weight:600;margin-top:8px;letter-spacing:-.03em;white-space:normal;font-variant-numeric:tabular-nums}
.eh-kpi b em{font-style:normal;font-size:12px;color:var(--muted);font-weight:500}
.eh-bars{display:flex;align-items:flex-end;gap:5px;height:25px;margin-top:12px}
.eh-bars i{flex:1;border-radius:3px;background:var(--accent);min-height:3px}
.eh-kpi>.progress{margin-top:13px;height:5px}
.eh-card{padding:20px;border-radius:22px;background:var(--panel);border:1px solid var(--line);box-shadow:none}
.eh-card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.eh-card-h b{font-size:16px;font-weight:600;letter-spacing:-.02em}
.eh-card-h small{color:var(--muted);font-size:11px;line-height:1.5}
.eh-card-h>svg{color:var(--accent);width:24px;height:24px}
.eh-link{display:inline-flex;align-items:center;justify-content:flex-end;gap:3px;padding:7px 0;min-height:44px;background:none;border:0;color:var(--accent);font-size:12px;font-weight:600;text-align:right}
.eh-link svg{width:15px;height:15px}
.eh-chart canvas{height:180px}
.eh-macros{display:flex;align-items:center;gap:18px}
.eh-donut{width:100px;height:100px;border-radius:50%;flex:none;display:grid;place-items:center;position:relative}
.eh-donut:before{content:'';position:absolute;inset:12px;border-radius:50%;background:var(--panel)}
.eh-donut>div{position:relative;font-size:19px;font-weight:600;text-align:center}.eh-donut small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.eh-legend{flex:1;min-width:0}.eh-legend>div{display:grid;grid-template-columns:7px 1fr auto;gap:7px;align-items:center;padding:8px 0;font-size:11px}.eh-legend i{width:7px;height:7px;border-radius:50%}.eh-legend b{font-weight:600}.eh-legend em{display:none}
.eh-habits{display:grid;gap:6px}.eh-habit{display:flex;align-items:center;gap:12px;min-height:46px;padding:5px 0;font-size:13px;font-weight:500;color:var(--text)}
.eh-habit input{width:24px;height:24px;margin:0;accent-color:var(--accent)}
.eh-ring{--value:0;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--accent) calc(var(--value)*1%),var(--line) 0)}
.eh-ring:before{content:'';position:absolute;inset:5px;border-radius:50%;background:var(--panel)}.eh-ring b{position:relative;font-size:12px}
.eh-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.eh-tile{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:14px;border-radius:18px;background:var(--panel);border:1px solid var(--line);color:var(--text);text-align:left;min-height:96px;min-width:0}
.eh-tile svg{width:23px;height:23px;color:var(--accent)}.eh-tile b{font-size:12px;font-weight:550;line-height:1.3;overflow-wrap:anywhere}.eh-tile:hover{background:var(--soft)}
.eh-list{display:grid;gap:8px}.eh-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--text);text-align:left;width:100%;min-width:0}
.eh-row:last-child{border-bottom:0}.eh-row>div{min-width:0}.eh-row b{display:block;font-size:13px;font-weight:550;white-space:normal;overflow-wrap:anywhere}.eh-row small{color:var(--muted);font-size:11px}.eh-row>span{font-weight:600;font-size:12px;white-space:nowrap}
.eh-empty{color:var(--muted);font-size:13px;padding:6px 2px;line-height:1.6}.eh-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.eh-week{display:grid;gap:2px}.eh-week-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.eh-wd{display:grid;gap:9px;justify-items:center;font-size:11px;font-weight:500;color:var(--muted)}
.eh-wd i{width:min(34px,100%);aspect-ratio:1;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);font-style:normal}
.eh-wd i svg{width:60%;height:60%}.eh-wd.on i{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.eh-wd.today{color:var(--text);font-weight:700}.eh-wd.today i{border:2px solid var(--accent)}
@media(min-width:901px){
 .eh{gap:20px}.eh-hero{grid-column:1/9;min-height:330px;grid-row:2}.eh-kpis{grid-column:9/13;grid-template-columns:1fr 1fr;grid-row:2;align-content:stretch}
 .eh-kpi b{font-size:22px}.eh-chart{grid-column:1/8}.eh-macrocard{grid-column:8/13}
 .eh-habitcard{grid-column:1/5}.eh-recent{grid-column:5/9}.eh-prs{grid-column:9/13}.eh-tiles{grid-template-columns:repeat(6,minmax(0,1fr))}

}

/* Suivi de séance. */
.es{max-width:680px;margin:0 auto;padding-bottom:150px}
.es-top{position:sticky;top:0;z-index:20;margin:0 -20px;padding:calc(10px + var(--safe-t)) 20px 14px;background:var(--bg)}
.es-title{display:flex;align-items:center;gap:12px}
.es-round{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--text);display:grid;place-items:center;flex:none;padding:0}
.es-round.light{background:var(--primary);color:var(--on-primary);border-color:transparent}
.es-round.sm{width:44px;height:44px}.es-round.sm svg{width:19px;height:19px}
.es-title>div{flex:1;min-width:0}.es-title h1{font-size:24px;margin:0;white-space:normal;overflow-wrap:anywhere}.es-title small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.es-seg{display:flex;gap:5px;margin-top:16px}.es-seg i{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden;position:relative}
.es-seg i:after{content:'';position:absolute;inset:0;background:var(--accent);transform:scaleX(var(--f,0));transform-origin:left;transition:transform .3s ease}
.es-ex{margin-top:14px;border-radius:20px;background:var(--panel);border:1px solid var(--line);padding:16px;transition:border-color .2s}
.es-ex.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.es-ex-h{display:flex;align-items:center;gap:10px}
.es-thumb{width:52px;height:52px;border-radius:14px;background:var(--soft);border:0;display:grid;place-items:center;font-size:24px;flex:none}
.es-ex-h>div:not(.es-thumb){flex:1;min-width:0}.es-ex-h b{display:block;font-size:16px;font-weight:600;line-height:1.3}.es-ex-h small{color:var(--muted);font-size:12px}
.es-count{font-size:12px;font-weight:600;color:var(--accent);white-space:nowrap}.es-tag{display:inline-block;margin-bottom:8px;font-size:11px;font-weight:650;color:var(--accent)}
.es-sets{margin-top:16px;display:grid;gap:8px}.es-set,.es-lab{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) minmax(0,.8fr) 44px;gap:7px;align-items:center}
.es-lab{font-size:10px;font-weight:550;color:var(--muted);text-align:center;letter-spacing:.025em}
.es-n{font-size:13px;font-weight:600;color:var(--muted);text-align:center}
.es-set input{margin:0;min-height:46px;min-width:0;text-align:center;font-weight:600;font-size:16px;padding:8px 2px;border-radius:11px;background:var(--bg);font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.es-set input::-webkit-outer-spin-button,.es-set input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.es-check{width:44px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:transparent;display:grid;place-items:center;padding:0}

<script>/* Stockage isolé AVANT l’app : aucune donnée personnelle lue ou écrite. */
(() => {
  'use strict';
  const memoryStorage = () => {
    const values = new Map();
    return {
      get length() { return values.size; },
      key(index) { return [...values.keys()][index] ?? null; },
      getItem(key) { return values.get(String(key)) ?? null; },
      setItem(key, value) { values.set(String(key), String(value)); },
      removeItem(key) { values.delete(String(key)); },
      clear() { values.clear(); }
    };
  };
  try {
    const local = memoryStorage();
    const session = memoryStorage();
    Object.defineProperty(window, 'localStorage', { value: local, configurable: false });
    Object.defineProperty(window, 'sessionStorage', { value: session, configurable: false });
    window.__forgeDemoIsolated = window.localStorage === local && window.sessionStorage === session;
    session.setItem('forgeSplash', '1');
  } catch (_) {
    document.open();
    document.write('<!doctype html><html lang="fr"><meta charset="utf-8"><title>Aperçu indisponible</title><body><p>Ce navigateur ne permet pas l’aperçu isolé. Ouvre l’application avec un navigateur récent.</p></body></html>');
    document.close();
    window.stop();
    throw new Error('Isolation impossible. Aperçu interrompu.');
  }
})();
</script>

<script>/* FORGE — Validation des carnets, migration des sauvegardes et stockage par compte. */
const FORGE_BACKUP_VERSION=1;
const FORGE_BACKUP_MAX_BYTES=16*1024*1024;
let storageReadIssue=null;
function backupError(detail){return new Error('Cette sauvegarde ne correspond pas au format Forge.'+(detail?' '+detail:''))}
function plainRecord(value){return !!value&&typeof value==='object'&&!Array.isArray(value)&&(Object.getPrototypeOf(value)===Object.prototype||Object.getPrototypeOf(value)===null)}
function inspectBackupTree(root){
 let count=0;
 function walk(value,depth){
  if(++count>250000||depth>40)throw backupError('Le fichier est trop complexe.');
  if(typeof value==='number'&&!Number.isFinite(value))throw backupError('Un nombre est invalide.');
  if(value===null||typeof value!=='object')return;
  if(!Array.isArray(value)&&!plainRecord(value))throw backupError('Un objet est invalide.');
  for(const key of Object.keys(value)){
   if(['__proto__','prototype','constructor'].includes(key))throw backupError('Une propriété est interdite.');
   walk(value[key],depth+1);
  }
 }
 walk(root,0);

 const email=(document.getElementById('authEmail')?.value||'').trim().toLowerCase(),code=(document.getElementById('recCode')?.value||'').trim().toUpperCase(),pass=document.getElementById('authPass')?.value||'';
 const a=AUTH[email];

 a.salt=makeSalt();a.hash=await hashPassword(pass,a.salt);saveAuth();setAuthBusy(false);

<script>/* FORGE PROJECT — Série de connexion quotidienne (flammes), paliers et badges */
const STREAK_STEPS=[3,7,14,30,60,100];
const STREAK_LABELS={3:'Premier élan',7:'Une semaine de feu',14:'Deux semaines solides',30:'Régularité exceptionnelle',60:'Discipline de fer',100:'Légende FORGE'};
function isoDay(d){return d.toISOString().slice(0,10)}
function loginStreak(){
 const set=new Set(DB.visits||[]);let d=new Date(),k=today();
 if(!set.has(k)){d.setDate(d.getDate()-1);k=isoDay(d);if(!set.has(k))return 0}
 let n=0;while(set.has(k)){n++;d.setDate(d.getDate()-1);k=isoDay(d)}return n;
}
function flame(size){return `<span class="flame" style="--s:${size||1}" aria-hidden="true">${ico('flame')}</span>`}
function recordVisit(){
 if(!isLogged()||!DB||!DB.profile)return;
 DB.visits=DB.visits||[];const t=today();if(DB.visits.includes(t))return;
 const prevBest=DB.visitBest||0;
 DB.visits.push(t);if(DB.visits.length>800)DB.visits.shift();
 const n=loginStreak();DB.visitBest=Math.max(prevBest,n);
 DB.visitMilestones=DB.visitMilestones||[];
 const fresh=STREAK_STEPS.filter(s=>n>=s&&!DB.visitMilestones.includes(s));
 DB.visitMilestones.push(...fresh);
 const record=n>1&&n>prevBest;
 save();
 setTimeout(()=>celebrateStreak(n,fresh.at(-1),record),700);
}
function celebrateStreak(n,step,record){
 if(!step&&!record){toast(`${n} jour${n>1?'s':''} de présence d’affilée`);return}
 const title=step?STREAK_LABELS[step]:'Nouveau record de régularité';
 document.getElementById('modalbox').innerHTML=`<div class="cele"><div class="cele-flame">${flame(3)}</div><div class="cele-n">${n}</div><div class="cele-u">jour${n>1?'s':''} de présence d’affilée</div><h2>${esc(title)}</h2><p class="sub">${step?`Palier de ${step} jours débloqué. Le badge est dans ton tableau de bord.`:`Ton meilleur score de régularité passe à ${n} jours.`}</p><button class="ea-btn red" onclick="closeModal()">Continuer</button></div>`;
 openModal();
}
function streakCalendar(){
 const set=new Set(DB.visits||[]),now=new Date(),y=now.getFullYear(),m=now.getMonth();
 const first=new Date(y,m,1),lead=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),tk=today();
 let cells=['L','M','M','J','V','S','D'].map(x=>`<span class="sc-h">${x}</span>`).join('')+'<span></span>'.repeat(lead);
 for(let d=1;d<=days;d++){const k=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;cells+=`<span class="sc-d ${set.has(k)?'on':''} ${k===tk?'today':''}" ${set.has(k)?'title="Présence enregistrée"':''}>${d}</span>`}
 return `<div class="sc-grid" role="img" aria-label="Jours de présence ce mois-ci : ${[...set].filter(k=>k.startsWith(`${y}-${String(m+1).padStart(2,'0')}`)).length}">${cells}</div>`;
}
function streakCard(){
 const n=loginStreak(),best=Math.max(DB.visitBest||0,n),next=STREAK_STEPS.find(s=>s>n),prevStep=[...STREAK_STEPS].reverse().find(s=>s<=n)||0;
 const pct=next?Math.round((n-prevStep)/(next-prevStep)*100):100;
 const month=new Date().toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
 return `<section class="eh-card eh-streakcard rise" style="--i:3"><div class="eh-card-h"><b>Jours de présence</b></div><p class="sub">Jours consécutifs où tu ouvres Forge.</p>
  <div class="sk-main"><div class="sk-count">${flame(2)}<b>${n}</b><span>jour${n>1?'s':''}<br><small>Record : ${best}</small></span></div>
   <div class="sk-next"><small>${next?`Prochain palier : ${next} jours`:'Tous les paliers sont débloqués'}</small><div class="progress"><i style="width:${pct}%"></i></div></div>
   <div class="sk-badges">${STREAK_STEPS.map(s=>`<div class="sk-badge ${(DB.visitMilestones||[]).includes(s)?'on':''}" title="${esc(STREAK_LABELS[s])}"><span>${ico('flame')}</span><b>${s}</b></div>`).join('')}</div></div>
  <div class="sk-cal"><small>${month}</small>${streakCalendar()}</div>
 </section>`;
}

function showNotifs(){const n=(DB.notifications||[]).slice(0,8);document.getElementById('modalbox').innerHTML=`<div class="cele"><h2>Notifications</h2>${n.length?`<div class="eh-list" style="text-align:left;margin:14px 0">${n.map(x=>`<div class="eh-row"><div><b>${esc(x.title||x.text||String(x))}</b></div></div>`).join('')}</div>`:'<p class="sub">Rien de nouveau pour l’instant.</p>'}<button class="ea-btn red" onclick="closeModal()">Fermer</button></div>`;openModal()}

<div class="card hero"><div class="eyebrow">TON ESPACE, TON RYTHME</div><h1 style="font-size:42px;margin-top:8px">FORGE.</h1><p class="sub">Ton entraînement, ta nutrition, tes habitudes et ta progression dans un seul espace.</p>

<script>/* FORGE — Bibliothèque d’exercices */
function installTemplate(id){const t=workoutTemplates.find(x=>x.id===id);if(!t)return;const p={id:uid(),name:t.name,days:[{id:uid(),name:t.tag,exercises:t.ex.map(e=>({id:uid(),name:e[0],sets:e[1],repsMin:e[2],repsMax:e[3],rest:e[4]}))}],next:0};DB.programs.push(p);DB.activeProgram=p.id;save();toast('Séance ajoutée à ton programme ⚡');nav('program')}
function addExerciseToSession(exId){const e=exerciseCatalog.find(x=>x.id===exId);if(!e)return;if(!DB.programs.length){const p={id:uid(),name:'Séance personnalisée',days:[{id:uid(),name:'Séance du jour',exercises:[],}],next:0};DB.programs.push(p);DB.activeProgram=p.id}const p=DB.programs.find(x=>x.id===DB.activeProgram)||DB.programs[0];if(!p.days?.length)p.days=[{id:uid(),name:'Séance du jour',exercises:[]}];const idx=Math.min(p.next||0,p.days.length-1),d=p.days[idx];if(d.exercises.some(x=>x.name===e.name)){toast('Cet exercice est déjà dans ta séance');return}d.exercises.push({id:uid(),name:e.name,sets:3,repsMin:8,repsMax:12,rest:90});DB.activeProgram=p.id;save();closeExerciseModal();toast(`${e.name} ajouté à ta séance ⚡`)}
function exerciseVideoUrl(e){return 'https://www.youtube.com/embed?listType=search&list='+encodeURIComponent(e.name+' exercice musculation technique')}
function openExerciseModal(id){const e=exerciseCatalog.find(x=>x.id===id);if(!e)return;const box=document.getElementById('modalbox');box.innerHTML=`<div class="exercise-modal"><button class="modal-close" onclick="closeExerciseModal()">×</button><div class="exercise-modal-video"><iframe src="${exerciseVideoUrl(e)}" title="Lecteur YouTube : ${esc(e.name)}" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><div class="exercise-modal-body"><div class="row wrap"><div><div class="eyebrow">EXERCICE · ${esc(e.level.toUpperCase())}</div><h1>${esc(e.name)}</h1><div class="sub">${esc(e.muscle)} · ${esc(e.equipment)}</div></div><span class="exercise-modal-icon">${e.ico}</span></div><div class="exercise-tags"><span>${esc(e.muscle)}</span><span>${esc(e.equipment)}</span><span>${esc(e.level)}</span></div><p class="sub exercise-tip">Consulte les détails et privilégie une exécution contrôlée avant d’augmenter la charge. Le lecteur externe dépend de YouTube et peut être indisponible.</p><div class="exercise-modal-actions"><button class="btn primary" onclick="addExerciseToSession('${e.id}')">＋ Ajouter à ma séance</button><button class="btn" onclick="closeExerciseModal()">Fermer</button></div></div></div>`;document.getElementById('modal').classList.add('show')}
function closeExerciseModal(){document.getElementById('modal').classList.remove('show');document.getElementById('modalbox').innerHTML=''}
function exerciseCard(e){return `<button type="button" class="exercise-card exercise-card-btn" onclick="openExerciseModal('${e.id}')"><div class="exercise-art"><span>${e.ico}</span><i></i><small>VOIR L’EXERCICE</small></div><div class="exercise-body"><div class="row"><b>${esc(e.name)}</b><span class="pill">${esc(e.level)}</span></div><div class="sub">${esc(e.muscle)} · ${esc(e.equipment)}</div><div class="exercise-wave"><i></i><i></i><i></i><i></i><i></i></div><div class="exercise-open">Détails et ajout <span>↗</span></div></div></button>`}
function exercises(){return `<div class="row wrap"><div><div class="eyebrow">THÈME · BIBLIOTHÈQUE</div><h1>Exercices</h1><div class="sub">Ouvre un mouvement pour voir les détails et l’ajouter à ta séance.</div></div><span class="pill orange">${exerciseCatalog.length} mouvements disponibles</span></div><div class="card library-toolbar" style="margin-top:16px"><input id="exerciseSearch" placeholder="Rechercher : squat, poulie, biceps…" oninput="filterExercises()"><select id="exerciseMuscle" onchange="filterExercises()"><option value="">Tous les muscles</option>${[...new Set(exerciseCatalog.map(x=>x.muscle))].map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="exerciseEquip" onchange="filterExercises()"><option value="">Tout le matériel</option>${[...new Set(exerciseCatalog.map(x=>x.equipment))].map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div id="exerciseGrid" class="exercise-grid">${exerciseCatalog.map(exerciseCard).join('')}</div><div class="card source-card"><div class="eyebrow">BIBLIOTHÈQUE ÉTENDUE</div><h2>Une ressource pour explorer</h2><p class="sub">Consulte une base externe d’exercices sur GitHub. Ces fiches ne sont pas toutes intégrées dans Forge.</p><a class="btn" href="https://github.com/yuhonas/free-exercise-db" target="_blank" rel="noopener">Voir la base GitHub ↗</a></div></div>`}
function filterExercises(){const q=(document.getElementById('exerciseSearch')?.value||'').toLowerCase(),m=document.getElementById('exerciseMuscle')?.value||'',eq=document.getElementById('exerciseEquip')?.value||'';const arr=exerciseCatalog.filter(e=>(!q||`${e.name} ${e.muscle} ${e.equipment}`.toLowerCase().includes(q))&&(!m||e.muscle===m)&&(!eq||e.equipment===eq));document.getElementById('exerciseGrid').innerHTML=arr.length?arr.map(exerciseCard).join(''):'<div class="empty">Aucun mouvement ne correspond. Essaie un autre mot ou retire un filtre.</div>'}
</script>
<script>/* FORGE — Programmes et séance en cours */
function workouts(){return `<div class="row wrap"><div><div class="eyebrow">THÈME · ENTRAÎNEMENT</div><h1>Séances</h1><div class="sub">Des séances prêtes à ajouter à ton programme.</div></div><button class="btn" onclick="nav('program')">Mon programme →</button></div><div class="template-grid" style="margin-top:16px">${workoutTemplates.map(t=>`<div class="template-card"><div class="template-glow">${t.tag}</div><div class="row"><span class="pill orange">Environ ${t.duration}</span><span class="sub">${t.ex.length} exercice${t.ex.length===1?'':'s'}</span></div><h2>${esc(t.name)}</h2><div class="template-list">${t.ex.map(e=>`<div><span>${esc(e[0])}</span><b>${e[1]} × ${e[2]}–${e[3]}</b></div>`).join('')}</div><button class="btn primary wide" onclick="installTemplate('${t.id}')">Ajouter à mon programme</button></div>`).join('')}</div></div>`}

function program(){
 if(!DB.programs.length)return `<div class="row"><div><div class="eyebrow">ENTRAÎNEMENT</div><h1>Programme</h1></div><button class="btn primary" onclick="openProgramModal()">+ Nouveau</button></div><div class="card empty">Crée ton premier programme ou choisis une séance proposée.</div>`;
 return `<div class="row wrap"><div><div class="eyebrow">ENTRAÎNEMENT</div><h1>Programmes</h1></div><button class="btn primary" onclick="openProgramModal()">+ Nouveau</button></div>
 <div class="grid g2" style="margin-top:16px">${DB.programs.map(p=>`<div class="card"><div class="row"><div><h2>${esc(p.name)}</h2><div class="sub">${p.days.length} séance${p.days.length===1?'':'s'} dans ce programme · ${p.id===DB.activeProgram?'Programme actif':'Disponible'}</div></div>${p.id===DB.activeProgram?'<span class="pill green">ACTIF</span>':''}</div>
 ${p.days.map((d,i)=>`<div class="item" style="margin-top:8px"><div><b>${esc(d.name)}</b><div class="sub">${d.exercises.length} exercice${d.exercises.length===1?'':'s'}</div></div><button class="btn small primary" onclick="startWorkout('${p.id}',${i})">▶</button></div>`).join('')}
 <div class="row gap" style="margin-top:12px"><button class="btn small" onclick="openProgramModal('${p.id}')">Modifier</button><button class="btn small" onclick="activateProgram('${p.id}')">Activer</button><button class="btn small" onclick="deleteProgram('${p.id}')">Supprimer</button></div></div>`).join('')}</div>`;
}
function openProgramModal(id){
 const p=id?JSON.parse(JSON.stringify(DB.programs.find(x=>x.id===id))):{id:null,name:'',days:[]};
 document.getElementById('modalbox').innerHTML=`<div class="row"><h2>${id?'Modifier':'Nouveau'} programme</h2><button class="icon" onclick="closeModal()">×</button></div>
 <label>Nom</label><input id="pn" value="${esc(p.name)}" placeholder="Push / Pull / Legs">
 <div id="days"></div><button class="btn small" onclick="addDayEditor()">+ Ajouter un jour</button><div class="row gap" style="margin-top:16px"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="saveProgramModal('${id||''}')">Enregistrer</button></div>`;
 window.editProg=p;renderDayEditors();document.getElementById('modal').classList.add('show')
}
function renderDayEditors(){document.getElementById('days').innerHTML=(window.editProg.days||[]).map((d,i)=>`<div class="card" style="margin-top:12px;padding:13px"><div class="row"><input style="margin:0" value="${esc(d.name)}" oninput="editProg.days[${i}].name=this.value"><button class="btn small danger" onclick="editProg.days.splice(${i},1);renderDayEditors()">×</button></div>
 ${d.exercises.map((e,j)=>`<div class="item" style="margin-top:7px"><span>${esc(e.name)} · ${e.sets}×${e.repsMin}-${e.repsMax} · ${e.rest}s</span><button class="btn small" onclick="editProg.days[${i}].exercises.splice(${j},1);renderDayEditors()">×</button></div>`).join('')}
 <div class="grid g2" style="margin-top:8px"><input id="en${i}" placeholder="Exercice"><input id="es${i}" type="number" value="3" placeholder="Séries"><input id="er1${i}" type="number" value="8" placeholder="Reps min"><input id="er2${i}" type="number" value="10" placeholder="Reps max"><input id="rt${i}" type="number" value="90" placeholder="Repos sec"></div><button class="btn small" onclick="addExerciseEditor(${i})">+ Exercice</button></div>`).join('')}
function addDayEditor(){window.editProg.days.push({id:uid(),name:'Jour '+(window.editProg.days.length+1),exercises:[]});renderDayEditors()}
function addExerciseEditor(i){
 const name=document.getElementById('en'+i).value.trim(),sets=Number(document.getElementById('es'+i).value),repsMin=Number(document.getElementById('er1'+i).value),repsMax=Number(document.getElementById('er2'+i).value),rest=Number(document.getElementById('rt'+i).value);
 if(!name||name.length>1000||['__proto__','prototype','constructor'].includes(name))return toast('Indique un nom d’exercice valide.');
 if(!Number.isInteger(sets)||sets<1||sets>100||!Number.isFinite(repsMin)||repsMin<=0||!Number.isFinite(repsMax)||repsMax<repsMin||repsMax>100000||!Number.isFinite(rest)||rest<0||rest>86400)return toast('Vérifie les séries, répétitions et secondes de repos.');
 window.editProg.days[i].exercises.push({id:uid(),name,sets,repsMin,repsMax,rest});renderDayEditors();
}
function saveProgramModal(id){
 const edited=JSON.parse(JSON.stringify(window.editProg));edited.name=document.getElementById('pn').value.trim()||'Mon programme';if(!edited.days.length)return toast('Ajoute au moins un jour');
 const next=JSON.parse(JSON.stringify(DB));if(id){const index=next.programs.findIndex(program=>program.id===id);if(index<0)return toast('Ce programme n’existe plus.');next.programs[index]=edited}else{edited.id=uid();next.programs.push(edited);if(!next.activeProgram)next.activeProgram=edited.id}
 try{commitUserDB(validateBackup(next))}catch(error){return toast(error.message.replace('Cette sauvegarde ne correspond pas au format Forge.','Le programme n’a pas été enregistré.'))}
 closeModal();render();toast('Programme enregistré');
}
function activateProgram(id){DB.activeProgram=id;save();render();toast('Programme actif')}
function deleteProgram(id){if(!confirm('Supprimer ce programme ?'))return;DB.programs=DB.programs.filter(p=>p.id!==id);if(DB.activeProgram===id)DB.activeProgram=DB.programs[0]?.id||null;save();render()}

/* Brouillon de séance : petit document distinct du carnet et isolé par compte. */
const WORKOUT_DRAFT_PREFIX='forge_workout_draft_v1:';
let restPaused=false,restOpen=false,restDeadline=0,restRemainingMs=0,workoutDraftSaved=true;
function workoutDraftKey(email=currentEmail()){return WORKOUT_DRAFT_PREFIX+encodeURIComponent(email)}
function workoutSetError(s){
 if(s.weight===''||!Number.isFinite(Number(s.weight))||Number(s.weight)<0)return 'Indique une charge de 0 kg ou plus.';
 if(s.reps===''||!Number.isInteger(Number(s.reps))||Number(s.reps)<=0)return 'Indique un nombre entier de répétitions supérieur à 0.';
 if(s.rpe!==''&&(!Number.isFinite(Number(s.rpe))||Number(s.rpe)<0||Number(s.rpe)>10))return 'Le RPE doit être compris entre 0 et 10, ou laissé vide.';
 return '';
}
function readWorkoutDraft(email=currentEmail()){
 if(!email)return null;
 try{
  const raw=localStorage.getItem(workoutDraftKey(email));if(!raw||raw.length>512000)return null;
  const d=JSON.parse(raw),s=d?.session;
  const text=x=>typeof x==='string'&&x.length<=1000;
  const id=x=>typeof x==='string'&&/^[A-Za-z0-9_.:-]{1,100}$/.test(x);
  const value=x=>(typeof x==='string'&&x.length<=32&&(x===''||Number.isFinite(Number(x))))||(typeof x==='number'&&Number.isFinite(x));
  if(d.version!==1||!Number.isFinite(d.updatedAt)||d.updatedAt<=Number(DB.workoutDraftResetAt||0)||d.owner!==email||!s||s.owner!==email||!id(s.id)||!id(s.pid)||!Number.isInteger(s.di)||s.di<0||!text(s.program)||!text(s.day)||!Number.isFinite(s.started)||s.started<0||s.started>Date.now()+60000)return null;
  if(!Array.isArray(s.exercises)||!s.exercises.length||s.exercises.length>100)return null;
  for(const e of s.exercises){
   if(!e||!text(e.name)||!text(e.target)||!Number.isFinite(e.rest)||e.rest<0||e.rest>86400||!Array.isArray(e.sets)||e.sets.length>100)return null;
   for(const set of e.sets)if(!set||!value(set.weight)||!value(set.reps)||!value(set.rpe)||typeof set.done!=='boolean'||(set.done&&workoutSetError(set)))return null;
  }
  const r=d.rest;
  if(!r||!Number.isFinite(r.remainingMs)||r.remainingMs<0||r.remainingMs>86400000||!Number.isFinite(r.deadline)||r.deadline<0||typeof r.paused!=='boolean'||typeof r.open!=='boolean')return null;
  // L’écriture du carnet peut avoir réussi juste avant une fermeture de l’onglet.
  // Un identifiant déjà enregistré ne doit jamais produire une seconde séance ou des XP.
  if(DB.sessions.some(x=>x.id===s.id)){try{localStorage.removeItem(workoutDraftKey(email))}catch{}return null}
  return d;
 }catch{return null}
}
function remainingRestMs(){return restPaused?restRemainingMs:Math.max(0,restDeadline-Date.now())}
function showWorkoutSaveState(){
 const el=document.getElementById('workoutDraftStatus');
 if(el){el.textContent=workoutDraftSaved?'Saisie conservée dans ce navigateur.':'La sauvegarde locale a échoué. Garde cette page ouverte pour conserver ta saisie.';el.setAttribute('role',workoutDraftSaved?'status':'alert')}
}
function persistWorkoutDraft(){
 if(!session)return true;
 const email=session.owner;
 if(!email||email!==currentEmail()||!isLogged())return false;
 const draft={version:1,owner:email,updatedAt:Math.max(Date.now(),Number(DB.workoutDraftResetAt||0)+1),session,rest:{deadline:restDeadline,remainingMs:remainingRestMs(),paused:restPaused,open:restOpen}};
 try{localStorage.setItem(workoutDraftKey(email),JSON.stringify(draft));workoutDraftSaved=true;showWorkoutSaveState();return true}
 catch{workoutDraftSaved=false;showWorkoutSaveState();return false}
}
function clearWorkoutDraft(email=currentEmail()){
 try{localStorage.removeItem(workoutDraftKey(email));return true}catch{toast('Le brouillon n’a pas pu être supprimé. Réessaie lorsque le stockage est disponible.');return false}
}
function stopWorkoutRuntime(){
 clearInterval(sessionTick);clearInterval(restTick);sessionTick=null;restTick=null;
 session=null;rest=0;restPaused=false;restOpen=false;restDeadline=0;restRemainingMs=0;
}
function suspendWorkout(){if(session&&!persistWorkoutDraft()){toast('La sauvegarde locale a échoué. Garde cette page ouverte pour conserver ta saisie.');return false}stopWorkoutRuntime();return true}
function startWorkoutClock(){
 clearInterval(sessionTick);
 const runningId=session.id,owner=session.owner;
 sessionTick=setInterval(()=>{if(!session||session.id!==runningId||currentEmail()!==owner)return;const el=document.getElementById('workTimer');if(el)el.textContent=fmtSec((Date.now()-session.started)/1000)},1000);
}
function workoutResumeCard(){
 if(view==='session'||view==='summary')return '';
 const d=session?{session}:readWorkoutDraft();if(!d)return '';
 const s=d.session,total=s.exercises.reduce((n,e)=>n+e.sets.length,0),done=s.exercises.reduce((n,e)=>n+e.sets.filter(x=>x.done).length,0);

   <div class="eh-habits">${DB.habits.slice(0,4).map(x=>`<label class="eh-habit"><input class="check" type="checkbox" ${DB.habitLog[`${today()}_${x.id}`]?'checked':''} onchange="toggleHabit('${x.id}',this.checked)"><span>${esc(x.name)}</span></label>`).join('')||'<div class="eh-empty">Aucune habitude pour l’instant.</div>'}</div>
  </section>

  <section class="eh-card eh-recent rise" style="--i:6">

   <div class="eh-list">${recent.map(x=>`<button class="eh-row" onclick="nav('history')"><div><b>${esc(x.day)}</b><small>${fmtDate(x.date)} · ${fmtSec(x.duration)}</small></div><span>${Math.round(x.volume).toLocaleString('fr-FR')} kg</span></button>`).join('')||'<div class="eh-empty">Ta première séance validée apparaîtra ici.</div>'}</div>

  <section class="eh-card eh-prs rise" style="--i:7">

 </div>`;

function openShortcut(type){

<script>/* FORGE — Nutrition, repas et eau */
function meals(){const ms=todayMeals();return `<div class="row wrap"><div><div class="eyebrow">THÈME · NUTRITION</div><h1>Idées de repas</h1><div class="sub">Une journée type à adapter à tes objectifs et à tes besoins.</div></div><span class="pill green">${ms.kcal} kcal enregistrées aujourd’hui</span></div><div class="meal-plan-grid" style="margin-top:16px">${mealPlans.map(m=>`<div class="meal-card"><div class="meal-icon">${m.ico}</div><div class="row"><span class="eyebrow">${m.time}</span><span class="pill">Exemple</span></div><h2>${esc(m.name)}</h2><div class="meal-items">${m.items.map(x=>`<span>${esc(x)}</span>`).join('')}</div><p class="sub">${esc(m.note)}</p></div>`).join('')}</div><div class="card" style="margin-top:14px"><div class="row"><div><div class="eyebrow">TON SUIVI</div><h2>Objectifs du jour</h2></div><button class="btn small" onclick="nav('nutrition')">Journal alimentaire</button></div>${macroBar('Calories',ms.kcal,DB.settings.calories,'orange')}${macroBar('Protéines',ms.p,DB.settings.protein,'green')}${macroBar('Glucides',ms.c,DB.settings.carbs,'blue')}${macroBar('Lipides',ms.f,DB.settings.fat,'purple')}</div>`}

function macroBar(name,val,target,c){return `<div style="margin:12px 0"><div class="row"><span>${name}</span><b>${Math.round(val)} / ${target}</b></div><div class="progress ${c==='green'?'green':c==='blue'?'blue':''}"><i style="width:${Math.min(100,val/target*100)}%"></i></div></div>`}
function todayMeals(){return DB.meals.filter(m=>m.date===today()).reduce((a,m)=>({kcal:a.kcal+m.kcal,p:a.p+m.p,c:a.c+m.c,f:a.f+m.f}),{kcal:0,p:0,c:0,f:0})}
function addWater(n){DB.water[today()]=(DB.water[today()]||0)+n;save();if(DB.water[today()]>=DB.settings.water && (DB.water[today()]-n)<DB.settings.water)award(20,'Objectif hydratation');render()}

function nutrition(){
 const m=todayMeals();
 return `<div class="row wrap"><div><div class="eyebrow">NUTRITION</div><h1>Journal alimentaire</h1><div class="sub">${fmtDate(today())}</div></div><button class="btn primary" onclick="openMealModal()">+ Repas</button></div>
 <div class="grid g4" style="margin-top:16px"><div class="stat"><small>Calories</small><b>${m.kcal}</b><small>/ ${DB.settings.calories} kcal</small></div><div class="stat"><small>Protéines</small><b>${Math.round(m.p)}g</b><small>/ ${DB.settings.protein}g</small></div><div class="stat"><small>Glucides</small><b>${Math.round(m.c)}g</b><small>/ ${DB.settings.carbs}g</small></div><div class="stat"><small>Lipides</small><b>${Math.round(m.f)}g</b><small>/ ${DB.settings.fat}g</small></div></div>
 <div class="card" style="margin-top:14px">${macroBar('Calories',m.kcal,DB.settings.calories,'orange')}${macroBar('Protéines',m.p,DB.settings.protein,'green')}${macroBar('Glucides',m.c,DB.settings.carbs,'blue')}${macroBar('Lipides',m.f,DB.settings.fat,'orange')}</div>
 <div class="card" style="margin-top:14px"><div class="row"><h2>Repas du jour</h2><button class="btn small" onclick="openMealModal()">+ Ajouter</button></div><div class="list">${DB.meals.filter(x=>x.date===today()).map(m=>`<div class="item"><div><b>${esc(m.meal)}</b><div class="sub">${esc(m.food)} · ${m.grams}g</div></div><div><b>${m.kcal} kcal</b><br><small>${m.p}P · ${m.c}G · ${m.f}L</small></div><button class="btn small" onclick="deleteMeal('${m.id}')">×</button></div>`).join('')||'<div class="empty">Ton journal est prêt. Ajoute ton premier repas de la journée.</div>'}</div></div>
 <div class="card" style="margin-top:14px"><h2>Aliments</h2><div class="grid g3">${DB.foods.map(f=>`<div class="item"><div><b>${esc(f.name)}</b><div class="sub">${f.kcal} kcal/100g</div></div><button class="btn small" onclick="quickFood('${f.id}')">+</button></div>`).join('')}</div></div>`;
}
function openMealModal(foodId){
 const f=foodId?DB.foods.find(x=>x.id===foodId):null;
 document.getElementById('modalbox').innerHTML=`<div class="row"><h2>Ajouter un repas</h2><button class="icon" onclick="closeModal()">×</button></div>
 <label>Type de repas</label><select id="mealType"><option>Petit-déjeuner</option><option>Déjeuner</option><option>Dîner</option><option>Collation</option></select>
 <label>Aliment</label><select id="foodSel">${DB.foods.map(x=>`<option value="${x.id}" ${f?.id===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
 <label>Quantité (g)</label><input id="mealGrams" type="number" value="${f?100:100}">
 <button class="btn primary wide" onclick="addMeal()">Ajouter</button>`;
 document.getElementById('modal').classList.add('show')
}
function addMeal(){const f=DB.foods.find(x=>x.id===document.getElementById('foodSel').value),g=Number(document.getElementById('mealGrams').value);if(!f||!Number.isFinite(g)||g<=0)return toast('Choisis un aliment et une quantité supérieure à 0 g.');const m=g/100;if(![f.kcal,f.p,f.c,f.f].every(value=>Number.isFinite(value*m)))return toast('La quantité saisie est trop élevée.');const meal={id:uid(),date:today(),meal:document.getElementById('mealType').value,food:f.name,grams:g,kcal:Math.round(f.kcal*m),p:+(f.p*m).toFixed(1),c:+(f.c*m).toFixed(1),f:+(f.f*m).toFixed(1)};DB.meals.push(meal);save();closeModal();award(10,'Repas enregistré');if(todayMeals().p>=DB.settings.protein)award(50,'Objectif protéines atteint');render()}
function quickFood(id){openMealModal(id)}
function deleteMeal(id){DB.meals=DB.meals.filter(x=>x.id!==id);save();render()}

function hydrationCard(){const amount=DB.water[today()]||0,target=Math.max(1,DB.settings.water);return `<section class="eh-card hydration-card"><div class="eh-card-h"><div><b>Hydratation</b><br><small>Un repère pour ta journée</small></div><span>${amount.toLocaleString('fr-FR')} / ${target.toLocaleString('fr-FR')} ml</span></div><div class="progress"><i style="width:${Math.min(100,amount/target*100)}%"></i></div><div class="row gap wrap" style="margin-top:14px"><button class="btn" onclick="addWater(250)">+ 250 ml</button><button class="btn" onclick="addWater(500)">+ 500 ml</button></div></section>`}
</script>
<script>/* FORGE — Routine, habitudes et sommeil */
function routine(){return `<div class="row wrap"><div><div class="eyebrow">THÈME · ROUTINE</div><h1>Routine</h1><div class="sub">Un fil conducteur pour structurer ta journée.</div></div><span class="pill orange">Aujourd’hui</span></div><div class="routine-timeline" style="margin-top:18px">${routineBlocks.map((r,i)=>`<div class="routine-row"><div class="routine-time">${r[0]}</div><div class="routine-dot">${r[2]}</div><div class="routine-content"><div class="row"><h2>${r[1]}</h2><span class="sub">${i===5?'SÉANCE':i<5?'JOURNÉE':'Récupération'}</span></div><p class="sub">${r[3]}</p></div></div>`).join('')}</div><div class="grid g2" style="margin-top:16px"><div class="card"><h2>💧 Hydratation</h2><p class="sub">Repères simples : un peu régulièrement plutôt qu’une grosse quantité d’un coup. Ajuste selon chaleur, activité et soif.</p><div class="row gap">${[250,500,750].map(n=>`<button class="btn small" onclick="addWater(${n})">+ ${n} ml</button>`).join('')}</div></div><div class="card"><h2>😴 Récupération</h2><p class="sub">Garde des horaires de sommeil aussi réguliers que possible et prévois des jours plus légers lorsque la fatigue s’accumule.</p><button class="btn" onclick="nav('habits')">Gérer mes habitudes</button></div></div>`}

function habits(){
 const t=today();
 return `<div class="row"><div><div class="eyebrow">ROUTINES</div><h1>Habitudes</h1><div class="sub">Construis ta régularité.</div></div><button class="btn primary" onclick="openHabitModal()">+ Habitude</button></div>
 <div class="grid g2" style="margin-top:16px"><div class="card"><h2>Aujourd’hui</h2><div class="list">${DB.habits.map(h=>`<label class="item"><span><b>${esc(h.name)}</b><small class="sub"> · +${h.xp} XP</small></span><input class="check" type="checkbox" ${DB.habitLog[`${t}_${h.id}`]?'checked':''} onchange="toggleHabit('${h.id}',this.checked)"></label>`).join('')}</div></div>
 <div class="card"><h2>Hydratation & sommeil</h2><div class="item"><span>💧 Eau</span><b>${DB.water[t]||0} ml</b></div><div class="row gap" style="margin-top:8px">${[250,500,750].map(n=>`<button class="btn small" onclick="addWater(${n})">+ ${n} ml</button>`).join('')}</div><div class="item" style="margin-top:10px"><span>😴 Sommeil</span><b>${DB.sleep[t]?.hours||'—'}h</b></div><button class="btn small wide" style="margin-top:8px" onclick="openSleepModal()">Enregistrer le sommeil</button></div></div>
 <div class="card" style="margin-top:14px"><h2>Mes habitudes</h2><div class="list">${DB.habits.map(h=>`<div class="item"><span>${esc(h.name)}</span><button class="btn small" onclick="deleteHabit('${h.id}')">Supprimer</button></div>`).join('')}</div></div>`;
}
function toggleHabit(id,on){const k=`${today()}_${id}`;if(on&&!DB.habitLog[k]){DB.habitLog[k]=1;const h=DB.habits.find(x=>x.id===id);award(h?.xp??10,`Habitude : ${h?.name}`)}else if(!on)delete DB.habitLog[k];save();render()}
function openHabitModal(){document.getElementById('modalbox').innerHTML=`<h2>Nouvelle habitude</h2><input id="hn" placeholder="Ex. Marche 8 000 pas"><input id="hx" type="number" value="20" placeholder="XP"><div class="row gap"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="addHabit()">Créer</button></div>`;document.getElementById('modal').classList.add('show')}
function addHabit(){const n=document.getElementById('hn').value.trim(),xp=Number(document.getElementById('hx').value||10);if(!n||n.length>1000)return toast('Donne un nom à cette habitude (1 à 1 000 caractères).');if(!Number.isInteger(xp)||xp<0||xp>1000000)return toast('Les XP doivent être un entier entre 0 et 1 000 000.');DB.habits.push({id:uid(),name:n,xp});save();closeModal();render()}
function deleteHabit(id){DB.habits=DB.habits.filter(h=>h.id!==id);save();render()}
function openSleepModal(){document.getElementById('modalbox').innerHTML=`<h2>Sommeil</h2><label>Durée (heures)</label><input id="sh" type="number" step=".1" placeholder="7.5"><label>Qualité / 5</label><input id="sq" type="number" min="1" max="5" value="4"><div class="row gap"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="saveSleep()">Enregistrer</button></div>`;document.getElementById('modal').classList.add('show')}
function saveSleep(){const hours=Number(document.getElementById('sh').value),quality=Number(document.getElementById('sq').value);if(!Number.isFinite(hours)||hours<0||hours>24||!Number.isFinite(quality)||quality<1||quality>5)return toast('Indique une durée de 0 à 24 heures et une qualité de 1 à 5.');DB.sleep[today()]={hours,quality};save();closeModal();award(20,'Sommeil enregistré');render()}
</script>
<script>/* FORGE — Objectifs */
function goals(){
 const goals=DB.goals||[];
 return `<div class="row wrap"><div><div class="eyebrow">OBJECTIFS</div><h1>Mes objectifs</h1><div class="sub">Définis ce que tu veux suivre et garde une vue claire de ta progression.</div></div><button class="btn primary" onclick="openGoalModal()">+ Objectif</button></div>
 <div class="grid g3" style="margin-top:16px">${goals.map(g=>`<div class="card"><div class="row"><div><div class="eyebrow">${esc(g.type||'OBJECTIF')}</div><h2>${esc(g.name)}</h2></div><span class="pill green">${Math.min(100,Math.round((g.current||0)/Math.max(1,g.target)*100))}%</span></div><div class="progress green" style="margin-top:14px"><i style="width:${Math.min(100,(g.current||0)/Math.max(1,g.target)*100)}%"></i></div><div class="row" style="margin-top:9px"><span class="sub">${g.current||0} / ${g.target}</span><button class="btn small" onclick="deleteGoal('${g.id}')">×</button></div></div>`).join('')||`<div class="card empty" style="grid-column:1/-1">Aucun objectif pour le moment. Ajoute ton premier objectif.</div>`}</div>`;
}
function openGoalModal(){
 document.getElementById('modalbox').innerHTML=`<h2>Nouvel objectif</h2><label>Nom</label><input id="goalName" placeholder="Ex. 100 kg au développé couché"><label>Type</label><select id="goalType"><option>Performance</option><option>Poids</option><option>Habitude</option><option>Nutrition</option></select><label>Valeur actuelle</label><input id="goalCurrent" type="number" value="0"><label>Cible</label><input id="goalTarget" type="number" value="100"><div class="row gap"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="saveGoal()">Créer</button></div>`;
 document.getElementById('modal').classList.add('show')
}
function saveGoal(){const name=(document.getElementById('goalName')?.value||'').trim(),current=Number(document.getElementById('goalCurrent').value),target=Number(document.getElementById('goalTarget').value);if(!name||name.length>1000)return toast('Donne un nom à cet objectif (1 à 1 000 caractères).');if(!Number.isFinite(current)||current<0||!Number.isFinite(target)||target<=0)return toast('La valeur actuelle doit être positive ou nulle et la cible supérieure à 0.');DB.goals=DB.goals||[];DB.goals.push({id:uid(),name,type:document.getElementById('goalType').value,current,target});save();closeModal();render()}
function deleteGoal(id){DB.goals=(DB.goals||[]).filter(g=>g.id!==id);save();render()}
</script>
<script>/* FORGE — Calendrier */
function calendar(){
 const now=new Date(),month=now.getMonth(),year=now.getFullYear(),first=new Date(year,month,1),days=new Date(year,month+1,0).getDate(),offset=(first.getDay()+6)%7;
 const cells=Array.from({length:offset+days},(_,i)=>i<offset?null:i-offset+1);

 <div class="card" style="margin-top:16px"><div class="row"><h2>${now.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</h2><span class="pill">${DB.sessions.length} séances</span></div>
 <div class="calendar" style="margin-top:12px">${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(d=>`<div class="day" style="min-height:28px;padding:5px;font-weight:800;color:#777">${d}</div>`).join('')}${cells.map(d=>d?`<div class="day ${d===now.getDate()?'today':''}">${d}</div>`:'<div></div>').join('')}</div></div>
 <div class="card" style="margin-top:14px"><h2>Prochaines séances</h2><div class="list"><div class="item"><span>Aujourd’hui</span><b>Push · 18:00</b></div><div class="item"><span>17 mai</span><b>Legs · 18:00</b></div><div class="item"><span>19 mai</span><b>Pull · 18:00</b></div></div></div>`;
}
</script>
<script>/* FORGE — Communauté */
function community(){
 return `<div class="row"><div><div class="eyebrow">COMMUNAUTÉ</div><h1>Communauté</h1><div class="sub">Cet espace communautaire est en préparation. Rien n’est publié depuis cette version.</div></div></div>
 <div class="grid g2" style="margin-top:16px"><div class="card"><h2>Idées pour la communauté</h2><div class="list"><div class="item"><div><b>Défi de la semaine</b><div class="sub">Un futur espace pour échanger autour des séances et des objectifs.</div></div><span class="pill green">Exemple</span></div><div class="item"><div><b>Progression</b><div class="sub">Célèbre les petites victoires, série après série.</div></div><span>→</span></div></div></div>
 <div class="card"><h2>Ton profil local</h2><div class="row" style="margin-top:14px"><div><b>${esc(DB.profile.name||'Champion')}</b><div class="sub">Niveau ${xpLevel().level} · ${streak()} jours d’entraînement consécutifs</div></div><button class="btn" onclick="nav('settings')">Paramètres</button></div><div class="progress green" style="margin-top:16px"><i style="width:${Math.min(100,xpLevel().left/xpLevel().need*100)}%"></i></div></div></div>`;
}
</script>
<script>/* FORGE — Progression, poids et graphiques */
function progress(){
 const last=DB.weights.at(-1),prev=DB.weights.at(-2),lvl=xpLevel();
 const totalVol=DB.sessions.reduce((a,s)=>a+s.volume,0);
 return `<div class="row wrap"><div><div class="eyebrow">DATA</div><h1>Progression</h1><div class="sub">Transforme tes données en historique lisible.</div></div><button class="btn primary" onclick="openWeightModal()">+ Poids</button></div>
 <div class="grid g4" style="margin-top:16px"><div class="stat"><small>Poids actuel</small><b>${last?.value||'—'} kg</b><small>${prev?((last.value-prev.value>0?'+':'')+(last.value-prev.value).toFixed(1))+' kg vs précédent':''}</small></div><div class="stat"><small>Volume total</small><b>${Math.round(totalVol).toLocaleString('fr-FR')}</b><small>kg</small></div><div class="stat"><small>Records</small><b>${Object.keys(DB.prs).length}</b><small>records</small></div><div class="stat"><small>XP</small><b>${DB.xp}</b><small>niveau ${lvl.level}</small></div></div>
 <div class="grid g2" style="margin-top:14px"><div class="card"><div class="row"><h2>⚖️ Poids</h2><button class="btn small" onclick="openWeightModal()">Ajouter</button></div><canvas id="weightChart"></canvas><div class="list">${DB.weights.slice(-8).reverse().map(w=>`<div class="item"><span>${fmtDate(w.date)}</span><b>${w.value} kg</b></div>`).join('')||'<div class="empty">Enregistre ton premier poids.</div>'}</div></div>
 <div class="card"><h2>🏆 Records personnels</h2><div class="list">${Object.entries(DB.prs).map(([n,w])=>`<div class="item"><span>${esc(n)}</span><b>${w} kg</b></div>`).join('')||'<div class="empty">Tes records apparaîtront après tes séances.</div>'}</div></div></div>
 <div class="card" style="margin-top:14px"><h2>⚡ XP</h2><canvas id="xpChart"></canvas><div class="list">${DB.xpLog.slice(0,8).map(x=>`<div class="item"><span>${esc(x.reason)}</span><b class="xp">+${x.n}</b></div>`).join('')}</div></div>`;

function openWeightModal(){document.getElementById('modalbox').innerHTML=`<h2>Nouveau poids</h2><input id="wv" type="number" step=".1" placeholder="80.5"><div class="row gap"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="saveWeight()">Enregistrer</button></div>`;document.getElementById('modal').classList.add('show')}
function saveWeight(){const v=Number(document.getElementById('wv').value);if(!Number.isFinite(v)||v<=0)return toast('Indique un poids supérieur à 0 kg.');DB.weights.push({date:today(),value:v});DB.weights.sort((a,b)=>a.date.localeCompare(b.date));save();closeModal();award(10,'Poids enregistré');render()}
function drawCharts(){setTimeout(()=>{drawLine('weightChart',DB.weights.map(x=>x.value),getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#315648');drawLine('xpChart',DB.xpLog.slice(0,30).reverse().reduce((a,x)=>{a.push((a.at(-1)||0)+x.n);return a},[]),getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#315648');drawHomeChart()},50)}
function drawHomeChart(){
 const c=document.getElementById('homeProgressChart'); if(!c)return;
 const dpr=window.devicePixelRatio||1,w=c.clientWidth||600,h=220;c.width=w*dpr;c.height=h*dpr;
 const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);
 const line=getComputedStyle(document.documentElement).getPropertyValue('--line'),muted=getComputedStyle(document.documentElement).getPropertyValue('--muted');
 const cutoff=new Date();cutoff.setDate(cutoff.getDate()-180);
 const valid=validatedSessions().filter(s=>new Date(s.date+'T12:00:00')>=cutoff);
 const daily=new Map();valid.forEach(s=>daily.set(s.date,(daily.get(s.date)||0)+Number(s.volume||0)));
 const rows=[...daily.entries()].sort((a,b)=>a[0].localeCompare(b[0]));
 const pad=30;x.strokeStyle=line;x.lineWidth=1;
 for(let i=0;i<4;i++){const y=pad+i*(h-pad*2)/3;x.beginPath();x.moveTo(pad,y);x.lineTo(w-pad,y);x.stroke()}
 x.fillStyle=muted;x.font='10px system-ui';
 if(!rows.length){x.textAlign='center';x.fillText('Aucune séance validée pour le moment',w/2,h/2);x.textAlign='left';return}
 let cumulative=0;const vals=rows.map(([date,v])=>(cumulative+=v,cumulative));
 const min=0,max=Math.max(...vals)||1;
 x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#315648';x.lineWidth=2.5;x.beginPath();
 vals.forEach((v,i)=>{const xx=pad+i*(w-pad*2)/Math.max(1,vals.length-1),yy=h-pad-(v-min)/Math.max(1,max-min)*(h-pad*2);i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.stroke();
 x.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#315648';vals.forEach((v,i)=>{const xx=pad+i*(w-pad*2)/Math.max(1,vals.length-1),yy=h-pad-(v-min)/Math.max(1,max-min)*(h-pad*2);x.beginPath();x.arc(xx,yy,3,0,Math.PI*2);x.fill()});
 x.fillStyle=muted;x.textAlign='center';
 rows.forEach(([date],i)=>{if(i===0||i===rows.length-1||rows.length<=6){const xx=pad+i*(w-pad*2)/Math.max(1,rows.length-1);const d=new Date(date+'T12:00:00');x.fillText(d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}),xx,h-4)}});x.textAlign='left';
}

function drawLine(id,data,color){const c=document.getElementById(id);if(!c)return;const dpr=devicePixelRatio||1,w=c.clientWidth,h=220;c.width=w*dpr;c.height=h*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);x.clearRect(0,0,w,h);if(data.length<2){x.fillStyle=getComputedStyle(document.body).getPropertyValue('--muted');x.fillText('Pas assez de données pour un graphique.',20,110);return}const min=Math.min(...data),max=Math.max(...data),pad=25;x.strokeStyle=getComputedStyle(document.body).getPropertyValue('--line');x.lineWidth=1;for(let i=0;i<4;i++){let y=pad+i*(h-pad*2)/3;x.beginPath();x.moveTo(pad,y);x.lineTo(w-pad,y);x.stroke()}x.strokeStyle=color;x.lineWidth=3;x.beginPath();data.forEach((v,i)=>{const xx=pad+i*(w-pad*2)/(data.length-1),yy=h-pad-(v-min)/(max-min||1)*(h-pad*2);i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.stroke()}
window.addEventListener('resize',()=>{if(view==='progress')drawCharts(); if(view==='home')setTimeout(drawHomeChart,50)});
</script>
