<script>/* FORGE — Paramètres, export / import */
function settings(){
 return `<div class="row"><div><div class="eyebrow">PARAMÈTRES</div><h1>Paramètres</h1></div></div>
 <section class="card theme-switch-card" style="margin-top:16px"><div><h2>Apparence</h2><p class="sub">Thème ${DB.settings.theme==='dark'?'sombre':'clair'}</p></div><button class="btn" onclick="toggleTheme()">${ico(DB.settings.theme==='dark'?'sun':'moon')} Changer de thème</button></section><div class="grid g2" style="margin-top:16px"><div class="card"><h2>Profil</h2><label>Nom</label><input id="sn" value="${esc(DB.profile.name)}"><label>Avatar</label><input id="sa" value="${esc(DB.profile.avatar)}"><label>Bio</label><textarea id="sb">${esc(DB.profile.bio)}</textarea><label>Objectif</label><input id="sg" value="${esc(DB.profile.goal)}"><button class="btn primary wide" onclick="saveSettings()">Enregistrer</button></div>
 <div class="card"><h2>Objectifs quotidiens</h2><p class="sub">Ces valeurs de départ sont à adapter à tes besoins. Forge ne les calcule pas à partir de ton profil.</p><label>Calories</label><input id="scal" type="number" value="${DB.settings.calories}"><label>Protéines (g)</label><input id="spr" type="number" value="${DB.settings.protein}"><label>Glucides (g)</label><input id="scb" type="number" value="${DB.settings.carbs}"><label>Lipides (g)</label><input id="sfa" type="number" value="${DB.settings.fat}"><label>Eau (ml)</label><input id="swa" type="number" value="${DB.settings.water}"><button class="btn primary wide" onclick="saveTargets()">Enregistrer</button></div></div>
 <div class="card" style="margin-top:14px"><h2>Compte</h2><div class="row wrap"><div><b>${esc(currentEmail())}</b><div class="sub">Compte local FORGE</div></div><button class="btn danger" onclick="logout()">Se déconnecter</button></div></div><div class="card" style="margin-top:14px"><h2>Données</h2><div class="row wrap"><button class="btn" onclick="exportData()">Exporter JSON</button><button class="btn" onclick="document.getElementById('importFile').click()">Importer JSON</button><input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="importData(this.files[0]);this.value=''"><button class="btn danger" onclick="wipe()">Effacer le carnet de ce compte</button></div><p class="sub">Le fichier exporté contient ton carnet, pas ton mot de passe ni ton code de récupération. La séance en cours est conservée séparément dans ce navigateur et n’est pas incluse dans le fichier. Pour la sauvegarder dans ton historique, termine-la avant l’export.</p></div>`;
}
function saveSettings(){
 const next=JSON.parse(JSON.stringify(DB));next.profile.name=document.getElementById('sn').value.trim()||'Champion';next.profile.avatar=document.getElementById('sa').value||'🏋️';next.profile.bio=document.getElementById('sb').value;next.profile.goal=document.getElementById('sg').value;
 try{const validated=validateBackup(next);commitUserDB(validated)}catch(error){return toast('Profil non enregistré. '+error.message.replace('Cette sauvegarde ne correspond pas au format Forge.','Vérifie les valeurs saisies.'))}
 toast('Profil enregistré');render();
}
function saveTargets(){
 const next=JSON.parse(JSON.stringify(DB));
 for(const [field,input] of [['calories','scal'],['protein','spr'],['carbs','scb'],['fat','sfa'],['water','swa']]){
  const value=Number(document.getElementById(input).value);if(!Number.isFinite(value)||value<=0)return toast('Chaque objectif doit être un nombre supérieur à 0.');next.settings[field]=value;
 }
 try{commitUserDB(validateBackup(next))}catch{return toast('Objectifs non enregistrés. Vérifie que le stockage est disponible.')}
 toast('Objectifs enregistrés');render();
}
let pendingBackupImport=null,backupImportSequence=0;
function downloadCarnet(text,name){const blob=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportData(){
 if(currentStorageIssue())return exportRecoveryData();
 const backup={...DB,_forgeBackup:{format:'forge-carnet',version:FORGE_BACKUP_VERSION,exportedAt:new Date().toISOString()}};
 downloadCarnet(JSON.stringify(backup,null,2),`forge-backup-${today()}.json`);toast('Copie de ton carnet exportée.');
}
function exportRecoveryData(){
 const issue=currentStorageIssue();if(!issue)return;
 try{const raw=localStorage.getItem(issue.key);if(raw===null)throw new Error('Carnet absent');downloadCarnet(raw,`forge-recuperation-${today()}.json`)}catch{toast('Le fichier local ne peut pas être lu. Aucun carnet n’a été remplacé.')}
}
function storageRecoveryPage(){
 const issue=currentStorageIssue();
 return `<main class="setup storage-recovery"><section class="setupbox card"><div class="eyebrow">RÉCUPÉRATION DU CARNET</div><h1>Ton carnet a besoin d’attention</h1><p class="sub">Le carnet de ${esc(currentEmail())} n’a pas pu être ouvert. Le fichier enregistré est conservé : aucune nouvelle donnée ne le remplace automatiquement.</p><p role="alert">${esc(issue?.message||'Le format de ce carnet ne peut pas être lu.')}</p><p class="sub">Exporte d’abord le fichier de secours pour en garder une copie. Tu peux ensuite importer une sauvegarde valide, ou choisir d’effacer uniquement le carnet de ce compte.</p><div class="grid" style="gap:12px"><button class="btn primary wide" onclick="exportRecoveryData()">Exporter le fichier de secours</button><button class="btn wide" onclick="document.getElementById('importFile').click()">Importer une sauvegarde</button><input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="importData(this.files[0]);this.value=''"><button class="btn danger wide" onclick="wipe()">Effacer le carnet de ce compte</button><button class="btn ghost wide" onclick="logout()">Se déconnecter</button></div></section></main>`;
}
function cancelBackupImport(){pendingBackupImport=null;closeModal()}
function importData(file){
 if(!file)return;
 pendingBackupImport=null;
 const sequence=++backupImportSequence,owner=currentEmail();
 if(!owner||!AUTH[owner])return toast('Connecte-toi au compte dont tu veux remplacer le carnet.');
 if(file.size>FORGE_BACKUP_MAX_BYTES)return toast('Ce fichier dépasse la taille maximale de 16 Mo.');
 const reader=new FileReader();
 reader.onerror=()=>toast('Ce fichier n’a pas pu être lu. Ton carnet n’a pas été modifié.');
 reader.onload=()=>{
  if(sequence!==backupImportSequence)return;
  if(owner!==currentEmail())return toast('Le compte a changé. Recommence l’import depuis le compte souhaité.');
  let source,staged;
  try{source=JSON.parse(reader.result)}catch{return toast('Ce fichier n’est pas un fichier JSON lisible.')}
  try{staged=validateBackup(source)}catch(error){return toast(error.message)}
  pendingBackupImport={owner,staged,sequence};
  const unknown=Object.keys(staged).filter(key=>!(key in defaultDB())&&!['photoNotice','workoutDraftResetAt'].includes(key)).length;
  const hasDraft=!!session||!!readWorkoutDraft();
  document.getElementById('modalbox').innerHTML=`<div class="backup-preview"><div class="eyebrow">IMPORTER UNE SAUVEGARDE</div><h2>Vérifie ta sauvegarde</h2><p class="sub">Cette sauvegarde remplacera le carnet de ce compte dans ce navigateur. Exporte ton carnet actuel si tu veux le conserver.</p><p><b>Compte :</b> ${esc(owner)}</p><div class="grid g3" style="margin:18px 0"><div class="stat"><b>${staged.sessions.length}</b><small>Séances</small></div><div class="stat"><b>${staged.meals.length}</b><small>Repas</small></div><div class="stat"><b>${staged.photos.length}</b><small>Photos</small></div></div><p class="sub">${staged.programs.length} programme${staged.programs.length>1?'s':''} · ${staged.habits.length} habitude${staged.habits.length===1?'':'s'} · profil ${esc(staged.profile.name||'sans prénom')}</p>${source._forgeBackup?'':'<p class="sub">Sauvegarde ancienne reconnue : les réglages manquants seront complétés.</p>'}${source.activeProgram&&staged.activeProgram===null?'<p class="sub">Le programme actif n’existe plus dans ce fichier. Les programmes présents sont conservés ; tu pourras en activer un.</p>':''}${unknown?`<p class="sub">${unknown} champ${unknown>1?'s':''} supplémentaire${unknown>1?'s':''} conservé${unknown>1?'s':''} dans le carnet.</p>`:''}${hasDraft?'<p>Ta séance en cours sera abandonnée seulement si le remplacement réussit.</p>':''}<p class="sub">Ton compte, ton mot de passe et les autres profils ne seront pas modifiés.</p><div class="row gap wrap" style="margin-top:18px"><button class="btn primary" onclick="confirmBackupImport()">Remplacer mon carnet</button><button class="btn" onclick="cancelBackupImport()">Annuler</button></div></div>`;
  openModal();
 };
 reader.readAsText(file);
}
function confirmBackupImport(){
 const pending=pendingBackupImport;if(!pending)return;
 if(pending.owner!==currentEmail()||!AUTH[pending.owner]){pendingBackupImport=null;closeModal();return toast('Le compte a changé. Recommence l’import depuis le compte souhaité.')}
 const next={...pending.staged,workoutDraftResetAt:Date.now()};
 try{commitUserDB(next,pending.owner)}catch{return toast('Le carnet n’a pas pu être enregistré. Tes données précédentes sont conservées.')}
 pendingBackupImport=null;clearWorkoutDraft(pending.owner);stopWorkoutRuntime();window.lastSummary=null;
 closeModal();view=DB.profile.setup?'home':'setup';render();toast('Sauvegarde importée. Ton carnet est prêt.');
}
function wipe(){
 const owner=currentEmail();
 if(!confirm('Effacer le carnet de ce compte ? Séances, repas, photos et séance en cours seront supprimés de ce navigateur. Le compte et les autres profils seront conservés.'))return;
 const next={...defaultDB(),workoutDraftResetAt:Date.now()};
 try{commitUserDB(next,owner)}catch{return toast('Le carnet n’a pas pu être effacé. Tes données précédentes sont conservées.')}
 pendingBackupImport=null;clearWorkoutDraft(owner);stopWorkoutRuntime();window.lastSummary=null;closeModal();view='setup';render();toast('Le carnet de ce compte a été effacé.');
}
</script>

render=(()=>{return function(){applyTheme();if(!isLogged()){document.getElementById('root').innerHTML=authPage();return}if(currentStorageIssue()){document.getElementById('root').innerHTML=storageRecoveryPage();return}recordVisit();let c;if(view==='setup')c=setupPage();else if(view==='session')c=shell(sessionPage());else if(view==='summary')c=shell(summary());else c=shell((pages[view]||home)());document.getElementById('root').innerHTML=c;if(view==='progress')drawCharts(); if(view==='home')setTimeout(drawHomeChart,50)}})();

<script>/* FORGE — Rappel whey (extension de nutrition) */
function wheyCard(){return `<div class="card" style="margin-top:14px"><h2>🥤 Rappel whey</h2><p class="sub">La whey est facultative : adapte la portion à tes besoins et aux indications du produit.</p><p class="sub">Les valeurs nutritionnelles utilisent une estimation générique. Vérifie l’étiquette de ton produit.</p><div class="grid g3"><div><label class="whey-toggle" for="wheyEnabled"><input id="wheyEnabled" type="checkbox" ${DB.whey?.enabled?'checked':''}><span>Activer les rappels</span></label></div><div><label for="wheyDose">Portion prévue (g)</label><input id="wheyDose" type="number" min="1" max="100" value="${DB.whey?.dose||30}"></div><div><label for="wheyTimes">Heures (2 max, séparées par une virgule)</label><input id="wheyTimes" value="${(DB.whey?.times||['10:00','16:00']).join(', ')}"></div></div><div class="row wrap" style="margin-top:10px"><button class="btn primary" onclick="saveWheySettings()">Enregistrer</button><button class="btn" onclick="requestWheyNotifications()">Autoriser les notifications</button><button class="btn" onclick="logWhey()">J’ai pris ma whey</button></div><div class="sub">Les rappels automatiques nécessitent que FORGE soit ouvert (ou actif en arrière-plan) et que le navigateur autorise les notifications.</div></div>`}
const _nutritionOriginal=nutrition;
nutrition=function(){return _nutritionOriginal()+wheyCard()};

function saveWheySettings(){DB.whey=DB.whey||{};DB.whey.enabled=!!document.getElementById('wheyEnabled')?.checked;DB.whey.dose=Math.max(1,Math.min(100,+document.getElementById('wheyDose')?.value||30));DB.whey.times=(document.getElementById('wheyTimes')?.value||'10:00, 16:00').split(',').map(x=>x.trim()).filter(x=>/^([01]\d|2[0-3]):[0-5]\d$/.test(x)).slice(0,2);DB.whey.lastTaken=DB.whey.lastTaken||{};save();toast('Rappels whey enregistrés');render();checkForgeReminders()}
function logWhey(){DB.whey=DB.whey||{dose:30,times:[],lastTaken:{}};const grams=DB.whey.dose||30;DB.meals.push({id:uid(),date:today(),meal:'Collation',food:'Whey (portion enregistrée)',grams,kcal:Math.round(grams*4),p:Math.round(grams*.75*10)/10,c:Math.round(grams*.08*10)/10,f:Math.round(grams*.06*10)/10});const now=new Date(),slot=(DB.whey.times||[])[0]||'prise';DB.whey.lastTaken[today()+'_'+slot]=now.toISOString();save();toast('Prise ajoutée au journal nutritionnel');render()}
function requestWheyNotifications(){if(!('Notification'in window)){toast('Notifications non prises en charge');return}Notification.requestPermission().then(p=>{toast(p==='granted'?'Notifications autorisées':p==='denied'?'Notifications bloquées dans ce navigateur':'Autorisation non accordée pour le moment');checkForgeReminders()})}
</script>
<script>/* FORGE — Photos de progression (extension de progress) */
const _progressOriginal=progress;
progress=function(){let html=_progressOriginal();const photos=(DB.photos||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));const card=`<div class="card" style="margin-top:14px"><div class="row wrap"><div><h2>📸 Suivi photo</h2><p class="sub">Une photo tous les 7 jours pour suivre ton évolution, avec sa date d’ajout au carnet.</p></div><button class="btn primary" onclick="document.getElementById('forgePhotoInput').click()">+ Ajouter une photo</button><input id="forgePhotoInput" type="file" accept="image/*" multiple style="display:none" onchange="saveProgressPhotos(this.files)"></div><div class="row wrap" style="margin:12px 0"><span class="pill">Dernière photo : ${photos.length?fmtDate(photos[0].date):'aucune'}</span><span class="pill">Prochain rappel : ${nextPhotoReminderLabel()}</span><button class="btn" onclick="requestPhotoNotifications()">Activer notifications</button></div><div class="grid g3">${photos.map(ph=>`<div class="card" style="padding:8px"><img src="${ph.data}" alt="Photo ajoutée le ${esc(ph.date)}" style="width:100%;height:220px;object-fit:cover;border-radius:8px"><div class="row" style="margin-top:8px"><b>${fmtDate(ph.date)}</b><button class="btn small danger" onclick="deleteProgressPhoto('${ph.id}')">Supprimer</button></div><div class="sub">Ajoutée le ${new Date(ph.takenAt||ph.date).toLocaleString('fr-FR')}</div></div>`).join('')||'<div class="empty">Aucune photo enregistrée pour le moment.</div>'}</div></div>`;return html+card};

function requestPhotoNotifications(){if(!('Notification'in window)){toast('Notifications non prises en charge');return}Notification.requestPermission().then(p=>{toast(p==='granted'?'Notifications autorisées':p==='denied'?'Notifications bloquées dans ce navigateur':'Autorisation non accordée pour le moment');checkForgeReminders()})}
function nextPhotoReminderLabel(){const last=(DB.photos||[]).map(x=>x.date).sort().at(-1);if(!last)return '7 jours après la première photo';const d=new Date(last+'T12:00:00');d.setDate(d.getDate()+7);return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})}
function saveProgressPhotos(files){const arr=Array.from(files||[]).filter(f=>f.type.startsWith('image/')).slice(0,5);if(!arr.length)return;let finished=0;arr.forEach(file=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,1000/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);DB.photos=DB.photos||[];DB.photos.push({id:uid(),date:today(),takenAt:new Date().toISOString(),pose:window.__pose||'',tag:(typeof memFilter!=='undefined'&&memFilter!=='all')?memFilter:'',data:c.toDataURL('image/jpeg',.75)});finished++;if(finished===arr.length){try{save();toast('Photos ajoutées au carnet');render()}catch(e){toast('Stockage local plein : supprime des photos ou exporte tes données')}}};img.src=r.result};r.readAsDataURL(file)})}
function deleteProgressPhoto(id){if(confirm('Supprimer cette photo ?')){DB.photos=(DB.photos||[]).filter(p=>p.id!==id);save();render()}}
</script>
<script>/* FORGE — Rappels et notifications */
function checkForgeReminders(){if(!('Notification'in window)||Notification.permission!=='granted')return;const now=new Date(),hm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');if(DB.whey?.enabled&&(DB.whey.times||[]).includes(hm)){const k=today()+'_'+hm;if(!DB.whey.lastTaken?.[k]&&DB.whey.lastNotice!==k){new Notification('FORGE · Rappel whey',{body:'Portion prévue : '+DB.whey.dose+' g. À adapter à tes besoins et à l’étiquette.'});DB.whey.lastNotice=k;save()}}const last=(DB.photos||[]).map(p=>p.date).sort().at(-1);if(last){const d=new Date(last+'T12:00:00');d.setDate(d.getDate()+7);const due=d.toISOString().slice(0,10);if(today()>=due&&DB.photoNotice!==due){new Notification('FORGE · Photo de progression',{body:'Ton rappel hebdomadaire photo est arrivé.'});DB.photoNotice=due;save()}}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkForgeReminders()});setInterval(checkForgeReminders,30000);
</script>
<script>/* FORGE PROJECT — écrans « référence v3 » : présentation de séance, progression, programmes, nutrition, souvenirs */
let previewSel=null,progRange='week',memFilter='all';
function previewWorkout(pid,di){previewSel={pid,di};view='preview';window.__fresh=true;render();scrollTo(0,0)}
function setProgRange(r){progRange=r;keepScroll(render)}
function exMeta(name){return exerciseCatalog.find(x=>x.name===name)||{}}
function thumb(emoji,cls=''){return `<div class="r-thumb ${cls}" aria-hidden="true">${emoji||'🏋️'}</div>`}

/* 2. Présentation de séance */
function estDuration(d){const t=d.exercises.reduce((a,e)=>a+(Number(e.sets)||0)*(45+(Number(e.rest)||60)),0),m=Math.round(t/60);return m>=60?`${Math.floor(m/60)}h ${String(m%60).padStart(2,'0')}`:`${m} min`}
function equipOf(d){const q=[...new Set(d.exercises.map(e=>exMeta(e.name).equipment).filter(Boolean))];return q.length?'Matériel : '+q.slice(0,2).join(', '):'Matériel : —'}
function doneToday(n){return DB.sessions.some(s=>s.date===today()&&(s.exercises||[]).some(e=>e.name===n))}
function previewPage(){
 const p=previewSel&&DB.programs.find(x=>x.id===previewSel.pid),d=p?.days[previewSel.di];
 if(!d){view='home';return home()}
 const muscles=[...new Set(d.exercises.map(e=>exMeta(e.name).muscle).filter(Boolean))];
 const sets=d.exercises.reduce((a,e)=>a+(Number(e.sets)||0),0);
 return `<div class="r-prev">
  <div class="r-sub rise" style="--i:0"><button class="es-round" onclick="nav('program')" aria-label="Retour">${ico('back')}</button><h1>Séance</h1></div>
  <section class="r-prev-hero rise" style="--i:0">${photo('hero-today')}

   <div class="r-prev-body"><h1>${esc(d.name).toUpperCase()}</h1><p>${esc(muscles.join(' · ')||p.name)}</p>
    <div class="r-meta"><span>${ico('clock')}Environ ${estDuration(d)}</span><span>${ico('bolt')}${esc(DB.profile.level||'Intermédiaire')}</span><span>${ico('train')}${esc(equipOf(d))}</span></div>
    <button class="eh-go" onclick="startWorkout('${p.id}',${previewSel.di})">${ico('play')} Commencer la séance</button></div></section>
  <h2 class="r-h2 rise" style="--i:1">Exercices</h2>
  <div class="r-list rise" style="--i:2">${d.exercises.map(e=>`<div class="r-row">${thumb(exMeta(e.name).ico)}<div><b>${esc(e.name)}</b><small>${e.sets} × ${e.repsMin}–${e.repsMax}</small></div>${doneToday(e.name)?'<span class="r-ok">'+ico('check')+'</span>':''}${ico('chev')}</div>`).join('')||'<div class="eh-empty">Aucun exercice dans ce jour.</div>'}</div>
 </div>`}

/* 3. Progression */
function volBuckets(range){
 const S=DB.sessions.filter(s=>Number(s.volume)>0),now=new Date();now.setHours(12,0,0,0);
 const sum=(a,b)=>S.filter(s=>{const t=new Date(s.date+'T12:00:00');return t>=a&&t<b}).reduce((x,s)=>x+Number(s.volume),0);
 const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
 let labels=[],vals=[],prev=0;
 if(range==='week'){const mon=add(now,-((now.getDay()+6)%7));labels=['L','M','M','J','V','S','D'];vals=labels.map((_,i)=>sum(add(mon,i),add(mon,i+1)));prev=sum(add(mon,-7),mon)}
 else if(range==='month'){const start=add(now,-27);for(let i=0;i<4;i++){labels.push('S'+(i+1));vals.push(sum(add(start,i*7),add(start,i*7+7)))}prev=sum(add(start,-28),start)}
 else{for(let i=11;i>=0;i--){const a=new Date(now.getFullYear(),now.getMonth()-i,1),b=new Date(now.getFullYear(),now.getMonth()-i+1,1);labels.push(a.toLocaleDateString('fr-FR',{month:'narrow'}).toUpperCase());vals.push(sum(a,b))}const a=new Date(now.getFullYear()-1,now.getMonth()+1,1);prev=sum(new Date(now.getFullYear()-2,now.getMonth()+1,1),a)}
 return {labels,vals,prev,total:vals.reduce((a,b)=>a+b,0)};
}
function areaChart(labels,vals){
 const W=320,H=150,pl=30,pb=22,pt=8,max=Math.max(1,...vals),top=Math.ceil(max/1000)*1000||1000,n=vals.length;
 const x=i=>pl+(n>1?i*(W-pl-6)/(n-1):0),y=v=>pt+(H-pt-pb)*(1-v/top);
 const pts=vals.map((v,i)=>[x(i),y(v)]),line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
 const grid=[0,.25,.5,.75,1].map(f=>{const v=top*f,yy=y(v);return `<line x1="${pl}" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${pl-5}" y="${yy+3}" text-anchor="end" fill="var(--muted)" font-size="8">${v>=1000?(v/1000)+'k':v}</text>`}).join('');
 return `<svg class="r-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Volume d’entraînement, en kilogrammes multipliés par les répétitions"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".55"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${line} L${x(n-1)} ${H-pb} L${x(0)} ${H-pb}Z" fill="url(#ag)"/><path class="r-line" d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" pathLength="1"/>${labels.map((l,i)=>`<text x="${x(i)}" y="${H-6}" text-anchor="middle" fill="var(--muted)" font-size="9">${l}</text>`).join('')}</svg>`}
function progressPage(){
 const b=volBuckets(progRange),delta=b.prev?((b.total-b.prev)/b.prev*100):null;
 const last=DB.weights.at(-1),prevW=DB.weights.at(-2);
 const tabs=[['week','Semaine'],['month','4 semaines'],['year','12 mois']];
 return `<div class="r-page"><h1 class="r-title rise" style="--i:0">Progression</h1>
 <div class="r-seg rise" style="--i:1" role="tablist">${tabs.map(t=>`<button role="tab" aria-selected="${progRange===t[0]}" class="${progRange===t[0]?'on':''}" onclick="setProgRange('${t[0]}')">${t[1]}</button>`).join('')}</div>
 <section class="eh-card rise" style="--i:2"><small class="r-lab">Volume d’entraînement</small><div class="r-big"><b>${Math.round(b.total).toLocaleString('fr-FR')}</b><span>kg × rép.</span>${delta!==null?`<em class="${delta>=0?'up':'down'}">${delta>=0?'+':''}${delta.toFixed(0)}%</em>`:''}</div><p class="sub">Somme des charges × répétitions des séries enregistrées.</p>${b.total?areaChart(b.labels,b.vals):'<div class="eh-empty" style="padding:24px 0">Valide une séance pour voir ta progression.</div>'}</section>
 <section class="eh-card rise" style="--i:3"><div class="eh-card-h"><b>Records personnels</b></div><div class="eh-list">${Object.entries(DB.prs).sort((a,c)=>c[1]-a[1]).map(([n,w])=>`<div class="r-row">${thumb(exMeta(n).ico||'🏆','sm')}<div><b>${esc(n)}</b></div><strong>${w} kg</strong></div>`).join('')||'<div class="eh-empty">Tes records apparaîtront après tes séances.</div>'}</div></section>
 <section class="eh-card rise" style="--i:4"><div class="eh-card-h"><b>Poids</b><button class="eh-link" onclick="openWeightModal()">+ Ajouter</button></div><div class="r-big"><b>${last?last.value:'—'}</b><span>kg</span>${prevW?`<em class="${last.value<=prevW.value?'up':'down'}">${(last.value-prevW.value>0?'+':'')+(last.value-prevW.value).toFixed(1)} kg</em>`:''}</div><canvas id="weightChart"></canvas></section>
 <section class="eh-card rise" style="--i:5"><div class="eh-card-h"><b>Niveau ${xpLevel().level}</b><small>${DB.xp} XP</small></div><canvas id="xpChart"></canvas></section>
 <button class="r-link-card rise" style="--i:6" onclick="nav('coach')"><span>${ico('bolt')} Mon IA Coach</span>${ico('chev')}</button></div>`}

/* 8. Programmes */
function programPage(){
 if(!DB.programs.length)return `<div class="r-page"><h1 class="r-title">Programmes</h1><section class="eh-card"><div class="eh-empty">Crée ton premier programme ou choisis une séance proposée.</div><button class="btn primary wide" style="margin-top:14px" onclick="openProgramModal()">+ Créer un programme</button></section><button class="btn wide" style="margin-top:10px" onclick="nav('workouts')">Voir les séances recommandées</button></div>`;
 return `<div class="r-page"><h1 class="r-title rise" style="--i:0">Programmes</h1>
 <div class="r-chips rise" style="--i:1"><button onclick="nav('workouts')">Recommandés</button><button class="on">Tout</button><button onclick="openProgramModal()">Créer</button></div>
 ${DB.programs.map((p,k)=>{const act=p.id===DB.activeProgram,ex=p.days.reduce((a,d)=>a+d.exercises.length,0);return `<section class="r-prog rise" style="--i:${k+2}">
  <div class="r-row">${thumb(exMeta(p.days[0]?.exercises[0]?.name).ico||'🏋️','lg')}<div><b>${esc(p.name)}</b><small>${p.days.length} séance${p.days.length===1?'':'s'} dans ce programme · ${ex} exercice${ex===1?'':'s'}</small></div>${act?'<span class="r-badge">ACTIF</span>':''}</div>
  <div class="r-days">${p.days.map((d,i)=>`<button class="r-day" onclick="previewWorkout('${p.id}',${i})"><span>${esc(d.name)}</span><small>${d.exercises.length} exo</small>${ico('chev')}</button>`).join('')}</div>
  <div class="r-acts"><button class="btn small" onclick="openProgramModal('${p.id}')">Modifier</button>${act?'':`<button class="btn small" onclick="activateProgram('${p.id}')">Activer</button>`}<button class="btn small" onclick="deleteProgram('${p.id}')">Supprimer</button></div></section>`}).join('')}</div>`}

/* 4. Nutrition */

 return `<div class="r-page"><div class="r-top rise" style="--i:0"><h1 class="r-title">Journal alimentaire</h1><span class="r-top-r"><button class="es-round sm" onclick="nav('nutriai')" aria-label="Analyse IA">${ico('bolt')}</button><span class="eh-chip">Aujourd’hui ${ico('chev')}</span></span></div>

 <div class="r-chips rise" style="--i:5;flex-wrap:wrap">${DB.foods.map(f=>`<button onclick="quickFood('${f.id}')">${esc(f.name)}</button>`).join('')}</div>
 ${hydrationCard()}
 ${wheyCard()}
 <button class="r-link-card" onclick="nav('meals')"><span>${ico('food')} Idées de repas</span>${ico('chev')}</button></div>`}

/* 5-7. Souvenirs, avant/après, photo hebdo */
function setMemFilter(f){memFilter=f;keepScroll(render)}
function editPhoto(id){const p=DB.photos.find(x=>x.id===id);if(!p)return;const c=prompt('Légende de la photo',p.caption||'');if(c===null)return;p.caption=c.trim().slice(0,40);save();render()}

function memoriesPage(){
 const all=(DB.photos||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)),ph=memFilter==='all'?all:all.filter(p=>p.tag===memFilter);
 const chips=[['all','Tout'],['train','Entraînements'],['event','Événements']];
 return `<div class="r-page"><div class="r-top rise" style="--i:0"><h1 class="r-title">Souvenirs</h1><span class="r-top-r"><button class="r-ia" onclick="nav('coach')" aria-label="IA">IA</button><button class="es-round sm" onclick="document.getElementById('forgePhotoInput').click()" aria-label="Ajouter une photo">${ico('plus')}</button></span></div>
 <input id="forgePhotoInput" type="file" accept="image/*" multiple style="display:none" onchange="saveProgressPhotos(this.files)">
 <div class="r-chips rise" style="--i:1">${chips.map(c=>`<button class="${memFilter===c[0]?'on':''}" onclick="setMemFilter('${c[0]}')">${c[1]}</button>`).join('')}</div>
 <div class="r-grid rise" style="--i:2">${ph.map(p=>`<figure class="r-photo"><img src="${p.data}" alt="Photo ajoutée le ${esc(p.date)}" loading="lazy" onclick="editPhoto('${p.id}')"><figcaption><small>${fmtDate(p.date)}</small>${esc(p.caption||p.pose||'')}</figcaption><button class="r-tag" onclick="cyclePhotoTag('${p.id}')" aria-label="Changer la catégorie">${p.tag==='train'?'Entraînement':p.tag==='event'?'Événement':'+ Catégorie'}</button><button class="r-x" onclick="deleteProgressPhoto('${p.id}')" aria-label="Supprimer la photo">×</button></figure>`).join('')||`<div class="eh-empty" style="grid-column:1/-1">${all.length?'Aucune photo dans cette catégorie.':'Garde une trace de ton parcours. Ajoute ton premier souvenir.'}</div>`}</div>
 <button class="r-link-card" onclick="requestPhotoNotifications()"><span>${ico('bell')} Rappel photo hebdomadaire</span>${ico('chev')}</button><div class="r-two rise" style="--i:3"><button class="r-link-card" onclick="nav('weekly')"><span>${ico('camera')} Photo hebdo</span>${ico('chev')}</button><button class="r-link-card" onclick="nav('beforeafter')"><span>${ico('trend')} Avant / Après</span>${ico('chev')}</button></div></div>`}

/* Accueil : photo de la semaine + état du jour (données réelles) */

/* 10. Calendrier : la sélection porte uniquement sur des séances enregistrées. */
let calOff=0,calSelectedDay='';
function validCalendarDay(value){
 if(typeof value!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(value)||value.slice(0,4)==='0000')return false;
 const date=new Date(value+'T12:00:00Z');return Number.isFinite(date.getTime())&&date.toISOString().slice(0,10)===value;
}
function calendarRef(offset=calOff){const ref=new Date();ref.setHours(12,0,0,0);ref.setDate(1);ref.setMonth(ref.getMonth()+offset);return ref}
function calendarMonthKey(ref){return String(ref.getFullYear()).padStart(4,'0')+'-'+String(ref.getMonth()+1).padStart(2,'0')}
function fullDateLabel(day){return new Date(day+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}
function calMove(n){
 const next=calendarRef(calOff+n);if(!Number.isInteger(n)||next.getFullYear()<1||next.getFullYear()>9999)return;
 calOff+=n;calSelectedDay='';render();
}
function selectCalendarMonth(value){
 if(typeof value!=='string'||!/^\d{4}-\d{2}$/.test(value)||!validCalendarDay(value+'-01')){toast('Choisis un mois valide.');render();return}
 const now=new Date();calOff=(Number(value.slice(0,4))-now.getFullYear())*12+Number(value.slice(5,7))-1-now.getMonth();calSelectedDay='';render();
}
function selectCalendarDay(value){
 if(!value){calSelectedDay='';render();return}
 if(!validCalendarDay(value)){toast('Choisis une date valide.');render();return}
 const now=new Date();calOff=(Number(value.slice(0,4))-now.getFullYear())*12+Number(value.slice(5,7))-1-now.getMonth();calSelectedDay=value;render();
}
function showCalendarMonth(){calSelectedDay='';render()}
function showCurrentCalendarMonth(){calOff=0;calSelectedDay='';render()}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));t.setUTCFullYear(d.getFullYear());const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y0=new Date(t);y0.setUTCMonth(0,1);return Math.ceil(((t-y0)/864e5+1)/7)}
function calendarPage(){
 const now=new Date(),ref=calendarRef(),y=ref.getFullYear(),m=ref.getMonth(),month=calendarMonthKey(ref),last=new Date(ref);last.setMonth(m+1,0);
 const days=last.getDate(),lead=(ref.getDay()+6)%7,tk=calendarMonthKey(now)+'-'+String(now.getDate()).padStart(2,'0');
 if(calSelectedDay&&!calSelectedDay.startsWith(month+'-'))calSelectedDay='';
 const key=d=>month+'-'+String(d).padStart(2,'0'),monthSessions=DB.sessions.filter(s=>s.date.startsWith(month+'-')),done=new Set(monthSessions.map(s=>s.date));
 const cells=[];for(let i=0;i<lead;i++)cells.push(null);for(let d=1;d<=days;d++)cells.push(d);while(cells.length%7)cells.push(null);
 let rows='';for(let r=0;r<cells.length/7;r++){
  const week=cells.slice(r*7,r*7+7),first=week.find(Boolean),weekDate=new Date(ref);weekDate.setDate(first||1);
  rows+=`<span class="cl-w" title="Semaine ${isoWeek(weekDate)}">${isoWeek(weekDate)}</span>`+week.map(d=>d?`<span class="cl-d ${key(d)===tk?'today':''} ${done.has(key(d))?'done':''} ${key(d)===calSelectedDay?'selected':''}"${key(d)===tk?' aria-current="date"':''}${key(d)===calSelectedDay?' style="outline:2px solid var(--text);outline-offset:2px"':''} title="${esc(fullDateLabel(key(d)))}${done.has(key(d))?' · séance enregistrée':''}">${d}</span>`:'<span></span>').join('');
 }
 const list=(calSelectedDay?monthSessions.filter(s=>s.date===calSelectedDay):monthSessions).sort((a,b)=>b.date.localeCompare(a.date)||(Date.parse(b.iso)||0)-(Date.parse(a.iso)||0));
 const label=ref.toLocaleDateString('fr-FR',{month:'long',year:'numeric'}),period=calSelectedDay?fullDateLabel(calSelectedDay):label;
 return `<div class="r-page">${subHead('Calendrier','home',`<button class="es-round" onclick="nav('program')" aria-label="Voir mes programmes" style="margin-left:auto">${ico('plus')}</button>`)}
 <section class="eh-card cl-period rise" style="--i:1"><div class="grid g2"><div><label for="calendarMonth">Mois affiché</label><input id="calendarMonth" type="month" min="0001-01" max="9999-12" value="${month}" onchange="selectCalendarMonth(this.value)"></div><div><label for="calendarDay">Jour à consulter</label><input id="calendarDay" type="date" min="0001-01-01" max="9999-12-31" value="${calSelectedDay}" onchange="selectCalendarDay(this.value)"></div></div><div class="row gap wrap"><button class="btn" onclick="showCalendarMonth()">Tout le mois</button><button class="btn" onclick="showCurrentCalendarMonth()">Mois actuel</button></div></section>
 <section class="eh-card rise" style="--i:2"><div class="cl-nav"><button onclick="calMove(-1)" aria-label="Mois précédent">${ico('back')}</button><b style="text-transform:capitalize">${label}</b><button onclick="calMove(1)" aria-label="Mois suivant" style="transform:scaleX(-1)">${ico('back')}</button></div>
  <div class="cl-grid"><span aria-label="Numéro de semaine"></span>${['L','M','M','J','V','S','D'].map(x=>`<span class="cl-h">${x}</span>`).join('')}${rows}</div><p class="sub" style="margin:14px 0 0">Les jours entourés contiennent une séance. Le jour actuel est rempli.${calSelectedDay?' Le jour choisi est encadré.':''}</p></section>
 <div class="eh-card-h rise" style="--i:3;margin-top:6px"><div><b>Séances enregistrées</b><p class="sub" style="margin:4px 0 0">${esc(period)}</p></div><small aria-live="polite">${list.length} séance${list.length===1?'':'s'}</small></div>
 <div class="r-list calendar-sessions rise" style="--i:4">${list.map(s=>`<div class="r-row" data-session-id="${esc(s.id)}"><span class="cl-ic">${ico('bolt')}</span><div><b>${esc(s.day)}</b><small><time datetime="${s.date}">${fullDateLabel(s.date)}</time></small></div><span class="cl-t">${fmtSec(s.duration)}</span></div>`).join('')||`<div class="eh-card eh-empty">${calSelectedDay?'Aucune séance enregistrée le '+fullDateLabel(calSelectedDay)+'.':'Aucune séance enregistrée en '+label+'.'}</div>`}</div></div>`;
}

/* 6. Avant / Après : sélection isolée par compte, jamais enregistrée dans un autre carnet. */
const beforeAfterChoices=new Map();
function orderedComparisonPhotos(){return (DB.photos||[]).slice().sort((a,b)=>a.date.localeCompare(b.date)||(Date.parse(a.takenAt)||0)-(Date.parse(b.takenAt)||0)||a.id.localeCompare(b.id))}
function comparisonChoice(photos){
 const owner=currentEmail();let choice=beforeAfterChoices.get(owner);
 if(!choice){choice={start:photos[0]?.id,end:photos.at(-1)?.id,notice:''};beforeAfterChoices.set(owner,choice)}
 const originalStart=choice.start,originalEnd=choice.end;
 if(!photos.some(p=>p.id===choice.start))choice.start=photos[0]?.id;
 if(!photos.some(p=>p.id===choice.end))choice.end=photos.at(-1)?.id;
 if(choice.start===choice.end&&photos.length>1)choice.end=photos.find(p=>p.id!==choice.start).id;
 if(photos.findIndex(p=>p.id===choice.start)>photos.findIndex(p=>p.id===choice.end))[choice.start,choice.end]=[choice.end,choice.start];
 if(choice.start!==originalStart||choice.end!==originalEnd)choice.notice='La sélection a été adaptée aux photos disponibles.';
 return choice;
}
function selectComparisonPhoto(side,id){
 const photos=orderedComparisonPhotos();if(!['start','end'].includes(side)||photos.length<2||!photos.some(p=>p.id===id))return;
 const choice=comparisonChoice(photos),other=side==='start'?'end':'start';
 if(choice[other]===id){toast('Choisis deux photos différentes.');render();return}
 choice[side]=id;choice.notice='';
 if(photos.findIndex(p=>p.id===choice.start)>photos.findIndex(p=>p.id===choice.end)){[choice.start,choice.end]=[choice.end,choice.start];choice.notice='Les photos ont été remises dans l’ordre des dates.'}
 keepScroll(render);
}
function sortedDatedRecords(records){return records.filter(record=>record&&validCalendarDay(record.date)).slice().sort((a,b)=>a.date.localeCompare(b.date))}
function beforeAfterPage(){
 const photos=orderedComparisonPhotos();
 if(photos.length<2)return `<div class="r-page">${subHead('Avant / Après','memories')}<section class="eh-card eh-empty">Ajoute deux photos pour observer ton évolution dans le temps.</section><button class="eh-go" onclick="nav('weekly')">Prendre la photo de la semaine</button></div>`;
 const choice=comparisonChoice(photos),a=photos.find(p=>p.id===choice.start),b=photos.find(p=>p.id===choice.end);
 const weights=sortedDatedRecords(DB.weights),w0=weights.filter(w=>w.date<=a.date).at(-1),w1=weights.filter(w=>w.date<=b.date).at(-1);
 const dw=w0&&w1&&w0!==w1?Math.round((w1.value-w0.value)*10)/10:null;
 const bodyFat=sortedDatedRecords(DB.measurements).filter(m=>Number.isFinite(m.bodyFat)&&m.date>=a.date&&m.date<=b.date),f0=bodyFat[0],f1=bodyFat.at(-1);
 const df=f0&&f1&&f0.date!==f1.date?Math.round((f1.bodyFat-f0.bodyFat)*10)/10:null;
 const sessions=DB.sessions.filter(s=>s.date>=a.date&&s.date<=b.date),volume=sessions.length?sessions.reduce((sum,s)=>sum+s.volume,0):null;
 const number=value=>value.toLocaleString('fr-FR',{maximumFractionDigits:1});
 const metric=(id,value,unit,label,signed=false)=>`<div class="ba-t"><b id="${id}" data-value="${value===null?'':value}">${value===null?'—':(signed&&value>0?'+':'')+number(value)+(unit?' '+unit:'')}</b><small>${label}</small></div>`;
 const options=(selected,other)=>photos.map((p,index)=>`<option value="${p.id}"${p.id===selected?' selected':''}${p.id===other?' disabled':''}>Ajoutée le ${esc(fullDateLabel(p.date))} · Photo ${index+1}${p.caption||p.pose?' · '+esc(p.caption||p.pose):''}</option>`).join('');
 const photo=(p,weight,label)=>`<figure data-photo-id="${p.id}"><img src="${p.data}" alt="${label} : photo enregistrée le ${esc(fullDateLabel(p.date))}"><figcaption><div>Ajoutée le <time datetime="${p.date}">${fullDateLabel(p.date)}</time></div><div>${weight?`Dernier poids relevé : ${number(weight.value)} kg · <time datetime="${weight.date}">${fullDateLabel(weight.date)}</time>`:'Aucun poids enregistré à cette date ou avant.'}</div></figcaption></figure>`;
 return `<div class="r-page">${subHead('Avant / Après','memories')}
 <section class="eh-card rise" style="--i:1"><h2>Choisis deux souvenirs à comparer</h2><div class="ba-selectors grid g2"><div><label for="beforePhoto">Photo de début</label><select id="beforePhoto" onchange="selectComparisonPhoto('start',this.value)">${options(a.id,b.id)}</select></div><div><label for="afterPhoto">Photo de fin</label><select id="afterPhoto" onchange="selectComparisonPhoto('end',this.value)">${options(b.id,a.id)}</select></div></div><p class="sub ba-note" style="margin-bottom:0" aria-live="polite">${choice.notice||'Les photos sont présentées dans l’ordre des dates.'} Les dates affichées sont les dates d’ajout enregistrées dans Forge.</p></section>
 <div class="ba-pills rise" style="--i:2"><span>Début · <time datetime="${a.date}">${fullDateLabel(a.date)}</time></span><span>Fin · <time datetime="${b.date}">${fullDateLabel(b.date)}</time></span></div>
 <div class="r-ba rise" style="--i:3">${photo(a,w0,'Début')}${photo(b,w1,'Fin')}</div>
 <div class="ba-tiles rise" style="--i:4">${metric('baWeightDelta',dw,'kg','Poids',true)}${metric('baFatDelta',df,'points','Masse grasse',true)}${metric('baVolume',Number.isFinite(volume)?volume:null,'','Volume enregistré')}</div>
 <section class="eh-card ba-note rise" style="--i:5"><p class="sub">${dw===null?'Poids : deux relevés distincts sont nécessaires pour calculer l’écart.':`Écart de poids entre les relevés du <time datetime="${w0.date}">${fullDateLabel(w0.date)}</time> et du <time datetime="${w1.date}">${fullDateLabel(w1.date)}</time>.`}</p><p class="sub">${df===null?'Masse grasse : deux mesures datées distinctes dans cette période sont nécessaires.':`Écart de masse grasse en points de pourcentage, entre les mesures du <time datetime="${f0.date}">${fullDateLabel(f0.date)}</time> et du <time datetime="${f1.date}">${fullDateLabel(f1.date)}</time>.`}</p><p class="sub">Volume en kg × répétitions : somme des charges × répétitions des ${sessions.length} séance${sessions.length===1?'':'s'} enregistrée${sessions.length===1?'':'s'} du <time datetime="${a.date}">${fullDateLabel(a.date)}</time> au <time datetime="${b.date}">${fullDateLabel(b.date)}</time>, dates incluses. Cet indicateur ne mesure pas à lui seul la force.</p></section>
 <button class="eh-go rise" style="--i:6" onclick="nav('progress')">Voir la progression</button></div>`;
}

  DB.water[dateAgo(0)] = 1800;

  localStorage.setItem('forge_accounts_v1',JSON.stringify(AUTH));

<script>/* Forge — présentation issue de la référence vidéo. Le carnet existant reste la source des données. */
const FORGE_ACCENTS={lime:['Vert citron','#b5ef00'],red:['Rouge','#ff4545'],orange:['Orange','#ff971b'],cyan:['Cyan','#00d2df'],blue:['Bleu','#528aff'],violet:['Violet','#b34cff'],pink:['Rose','#f52ac5']};
const FORGE_LINKS=[['home','home','Accueil'],['coach','bolt','Coach IA'],['program','train','Programmes'],['nutrition','food','Nutrition'],['sleep','moon','Sommeil'],['health','habit','Santé'],['progress','stats','Progression'],['memories','photo','Souvenirs'],['beforeafter','trend','Avant / Après'],['calendar','calendar','Calendrier'],['community','community','Communauté'],['profile','profile','Profil'],['premium','trophy','Forge Premium'],['settings','settings','Paramètres']];
let vfCollapsed=false,vfActivityPeriod='today',vfMacroPeriod='today',vfSleepPeriod='week';
let vfNutritionPeriod='today',vfNutritionTab='overview';
const vfSavedHome=pages.home,vfSavedNutrition=pages.nutrition,vfSavedCommunity=pages.community;
const vfSavedCoach=pages.coach,vfSavedProgram=pages.program,vfSavedProgress=pages.progress;
function vfNumber(n,d=0){return Number(n||0).toLocaleString('fr-FR',{maximumFractionDigits:d})}
function vfDateAgo(n){const d=new Date();d.setDate(d.getDate()-n);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function vfDays(period){return period==='month'?30:period==='week'?7:1}
function vfRecords(records,period){const start=vfDateAgo(vfDays(period)-1),end=vfDateAgo(0);return records.filter(x=>x.date>=start&&x.date<=end)}
function vfMeals(period){return vfRecords(DB.meals,period).reduce((a,x)=>({kcal:a.kcal+x.kcal,p:a.p+x.p,c:a.c+x.c,f:a.f+x.f}),{kcal:0,p:0,c:0,f:0})}
function vfCount(n,d=0){return `<span data-vf-count="${Number(n)||0}" data-decimals="${d}">${vfNumber(n,d)}</span>`}
function vfIcon(name){return `<span class="vf-icon">${ico(name)}</span>`}
function vfPeriod(id,value,handler,options=[['today','Aujourd’hui'],['week','7 jours'],['month','30 jours']]){return `<label class="vf-period" for="${id}">${ico('calendar')}<select id="${id}" aria-label="Période ${id.replace('vf-','')}" onchange="${handler}(this.value)">${options.map(([v,l])=>`<option value="${v}" ${v===value?'selected':''}>${l}</option>`).join('')}</select></label>`}
function vfSetPeriod(kind,value){if(!['today','week','month'].includes(value))return;const ids={activity:'vf-activite',macro:'vf-macros',sleep:'vf-sommeil',nutrition:'vf-nutrition'};if(kind==='activity')vfActivityPeriod=value;if(kind==='macro')vfMacroPeriod=value;if(kind==='sleep')vfSleepPeriod=value;if(kind==='nutrition')vfNutritionPeriod=value;render();document.getElementById(ids[kind])?.focus({preventScroll:true})}
function vfActivityRange(v){vfSetPeriod('activity',v)}
function vfMacroRange(v){vfSetPeriod('macro',v)}
function vfSleepRange(v){vfSetPeriod('sleep',v)}
function vfNutritionRange(v){vfSetPeriod('nutrition',v)}
function vfSelectAccent(key){if(!FORGE_ACCENTS[key])return;const previous=DB.profile.accent;DB.profile.accent=key;try{save()}catch{DB.profile.accent=previous;return toast('La couleur n’a pas pu être enregistrée.')}applyTheme();document.querySelectorAll('[data-accent]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.accent===key)));vfAnimate();drawCharts();document.querySelectorAll('.vf-ring-value,.vf-bar,.vf-chart-line').forEach(el=>el.getAnimations().forEach(animation=>{animation.cancel();animation.play()}));}
applyTheme=function(){const light=DB.settings.theme==='light',accent=FORGE_ACCENTS[DB.profile.accent]||FORGE_ACCENTS.lime;const root=document.documentElement;root.classList.toggle('light',light);root.style.colorScheme=light?'light':'dark';root.style.setProperty('--accent',accent[1]);root.style.setProperty('--primary',accent[1]);root.style.setProperty('--accent2',accent[1]);root.style.setProperty('--red',accent[1]);root.style.setProperty('--macro-carbs',accent[1]);document.querySelector('meta[name="theme-color"]')?.setAttribute('content',light?'#f4f4f4':'#080809')};
function vfToggleSidebar(){vfCollapsed=!vfCollapsed;document.querySelector('.vf-app')?.classList.toggle('vf-collapsed',vfCollapsed);document.querySelector('#vf-sidebar-toggle')?.setAttribute('aria-expanded',String(!vfCollapsed))}
function vfMenuClose(){document.querySelector('#vf-avatar-menu')?.remove();document.querySelector('#vf-avatar-button')?.setAttribute('aria-expanded','false')}
function vfAvatarMenu(){const existing=document.getElementById('vf-avatar-menu');if(existing){vfMenuClose();return}const key=FORGE_ACCENTS[DB.profile.accent]?DB.profile.accent:'lime';document.querySelector('.vf-topbar').insertAdjacentHTML('beforeend',`<section id="vf-avatar-menu" class="vf-avatar-menu" aria-label="Menu du profil"><div class="vf-menu-person">${vfIcon('profile')}<div><b>${esc(DB.profile.name||'Membre Forge')}</b><small>${esc(currentEmail())}</small></div></div><button onclick="nav('profile')">${ico('profile')} Mon profil</button><button onclick="nav('coach')">${ico('book')} Mon coach</button><details open><summary>${ico('settings')} Personnaliser</summary><p>Couleur d’accent</p><div class="vf-swatches">${Object.entries(FORGE_ACCENTS).map(([k,[label,color]])=>`<button data-accent="${k}" aria-label="Accent ${label}" aria-pressed="${key===k}" style="--swatch:${color}" onclick="vfSelectAccent('${k}')"><span></span></button>`).join('')}</div><button onclick="nav('settings')">${ico('settings')} Tous les paramètres</button></details><button class="vf-menu-logout" onclick="logout()">${ico('back')} Déconnexion</button></section>`);document.getElementById('vf-avatar-button').setAttribute('aria-expanded','true');document.querySelector('#vf-avatar-menu button')?.focus()}
document.addEventListener('click',e=>{if(!e.target.closest('#vf-avatar-menu,#vf-avatar-button'))vfMenuClose()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('vf-avatar-menu')){vfMenuClose();document.getElementById('vf-avatar-button')?.focus()}});
function vfSearch(){document.getElementById('modalbox').innerHTML=`<div class="row"><h2>Rechercher dans Forge</h2><button class="es-round" onclick="closeModal()" aria-label="Fermer la recherche">×</button></div><label for="vf-search-input">Page ou exercice</label><input id="vf-search-input" placeholder="Programme, squat, nutrition…" oninput="vfSearchResults(this.value)"><div id="vf-search-results" class="vf-search-results"></div>`;openModal();vfSearchResults('');document.getElementById('vf-search-input').focus()}
function vfSearchResults(q){const term=q.toLocaleLowerCase('fr').trim(),links=[...FORGE_LINKS,['exercises','book','Exercices'],['habits','habit','Habitudes'],['goals','goals','Objectifs'],['history','clock','Historique'],['routine','check','Ma routine']];const matches=links.filter(x=>x[2].toLocaleLowerCase('fr').includes(term));const exercises=term?exerciseCatalog.filter(x=>x.name.toLocaleLowerCase('fr').includes(term)).slice(0,6):[];document.getElementById('vf-search-results').innerHTML=matches.map(([route,icon,label])=>`<button onclick="nav('${route}')">${ico(icon)} ${label} ${ico('chev')}</button>`).join('')+exercises.map(x=>`<button onclick="nav('exercises');openExerciseModal('${x.id}')">${ico('train')} ${esc(x.name)}</button>`).join('')||'<p class="sub">Aucun résultat. Essaie un autre mot.</p>'}
function vfNotifications(){const draft=readWorkoutDraft();document.getElementById('modalbox').innerHTML=`<div class="row"><h2>Notifications</h2><button class="es-round" onclick="closeModal()" aria-label="Fermer les notifications">×</button></div><div class="vf-notice">${ico('bell')}<div><b>Tes rappels Forge</b><p class="sub">Photo : ${nextPhotoReminderLabel()}.</p><p class="sub">${DB.whey?.enabled?'Rappel whey activé aux heures enregistrées.':'Le rappel whey est désactivé.'}</p></div></div>${draft?'<button class="btn primary wide" onclick="closeModal();resumeWorkout()">Reprendre la séance en cours</button>':''}<button class="btn wide" onclick="nav('nutrition')">Gérer mes rappels</button>`;openModal()}
shell=function(content){const fresh=window.__fresh;window.__fresh=false;const streak=loginStreak(),days=['L','M','M','J','V','S','D'];const monday=new Date();monday.setDate(monday.getDate()-(monday.getDay()+6)%7);const marks=days.map((day,i)=>{const d=new Date(monday);d.setDate(d.getDate()+i);const key=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');return `<span title="${esc(key)}"><b>${day}</b><i class="${DB.visits.includes(key)?'on':''}"></i></span>`}).join('');return `<div data-view="${view}" class="app vf-app ${fresh?'fresh':''} ${vfCollapsed?'vf-collapsed':''} ${view==='session'?'is-session':''}"><aside class="vf-side"><button class="vf-brand" onclick="nav('home')" aria-label="Forge, accueil"><span class="vf-mark">f</span><b>forge.</b></button><nav class="vf-nav" aria-label="Rubriques Forge">${FORGE_LINKS.map(([route,icon,label])=>`<button class="${view===route?'active':''}" ${view===route?'aria-current="page"':''} onclick="nav('${route}')" title="${label}">${ico(icon)}<span>${label}</span></button>`).join('')}<button onclick="openAppMenu()" title="Toutes les rubriques">${ico('menu')}<span>Toutes les rubriques</span></button></nav><section class="vf-streak"><h3>Série de présence</h3><div>${vfIcon('flame')}<strong>${streak}</strong><span>jours</span></div><div class="vf-week">${marks}</div></section>${DB.demo?'<p class="vf-demo-label">Démonstration · données fictives</p>':''}<button class="vf-logout" onclick="logout()">${ico('back')}<span>Déconnexion</span></button></aside><div class="vf-workspace"><header class="vf-topbar mobile-topbar"><button id="vf-sidebar-toggle" class="vf-tool vf-desktop-only" onclick="vfToggleSidebar()" aria-label="Réduire ou agrandir le menu" aria-expanded="${!vfCollapsed}">${ico('menu')}</button><button class="vf-tool vf-mobile-only" onclick="openAppMenu()" aria-label="Toutes les rubriques">${ico('menu')}</button><button class="vf-mobile-brand vf-mobile-only" onclick="nav('home')" aria-label="Forge, accueil">f</button><span class="vf-page-name">${FORGE_LINKS.find(x=>x[0]===view)?.[2]||'Forge'}</span><div class="vf-top-actions"><button class="vf-search-trigger" onclick="vfSearch()" aria-label="Rechercher dans Forge">${ico('goals')}<span>Rechercher…</span><kbd>⌘ K</kbd></button><button class="vf-tool" onclick="toggleTheme()" aria-label="${DB.settings.theme==='dark'?'Activer le mode clair':'Activer le mode sombre'}" title="Changer de thème">${ico(DB.settings.theme==='dark'?'sun':'moon')}</button><button class="vf-tool" onclick="vfNotifications()" aria-label="Notifications" title="Notifications">${ico('bell')}</button><button id="vf-avatar-button" class="vf-avatar-button" onclick="vfAvatarMenu()" aria-label="Ouvrir le menu du profil" aria-expanded="false" aria-controls="vf-avatar-menu">${ico('profile')}<span>⌄</span></button></div></header><main class="main vf-main" id="main-content">${workoutResumeCard()}${content}</main><footer class="vf-footer"><span>forge. · Plus qu’une app, une discipline.</span><span>${DB.demo?'Exemples de données Forge':'Ton carnet reste dans ce navigateur'}</span></footer></div><nav class="mobile-nav" aria-label="Navigation principale">${mobileBtn('home','home','Accueil')}${mobileBtn('program','train','Séances')}${mobileBtn('nutrition','food','Nutrition')}${mobileBtn('memories','photo','Souvenirs')}${mobileBtn('profile','profile','Profil')}</nav></div>`};
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'&&isLogged()){e.preventDefault();vfSearch()}});
function vfImageSlot(kind='athlete'){return `<div class="vf-image-slot vf-image-${kind}" role="img" aria-label="Emplacement réservé pour ${kind==='athlete'?'la silhouette Forge':'une image Forge'}"><div class="vf-image-guide">${ico(kind==='athlete'?'profile':'photo')}<span>${kind==='athlete'?'Silhouette Forge':'Image Forge'}</span></div></div>`}
function vfStepsCard(){const count=DB.steps[vfDateAgo(0)]??null,goal=DB.settings.steps||8000,week=Object.entries(DB.steps).filter(([date])=>date>=vfDateAgo(6)&&date<=vfDateAgo(0)),avg=week.length?Math.round(week.reduce((sum,[,v])=>sum+v,0)/week.length):null;return `<section class="vf-card vf-week-volume">${vfCardHead('Pas du jour','<button class="vf-text-link" onclick="vfOpenSteps()">Ajouter un relevé</button>','trend')}<strong>${count===null?'—':vfCount(count)}<small> / ${vfNumber(goal)} pas</small></strong><div class="vf-progress-track"><i style="--progress:${Math.min(100,(count||0)/goal*100)}%"></i></div><div class="vf-volume-details"><div><span>Repère atteint</span><b>${count===null?'—':Math.round(count/goal*100)+' %'}</b></div><div><span>Moyenne sur 7 jours</span><b>${avg===null?'—':vfNumber(avg)}</b></div><div><span>Source</span><b class="vf-small-value">Saisie manuelle</b></div></div></section>`}
function vfOpenSteps(){document.getElementById('modalbox').innerHTML=`<h2>Pas du jour</h2><p class="sub">Recopie le total de ton compteur. Forge n’est pas connecté à un capteur.</p><label for="vf-steps-value">Nombre de pas</label><input id="vf-steps-value" type="number" min="0" max="200000" step="1" value="${DB.steps[vfDateAgo(0)]??''}" placeholder="Ex. 8000"><div class="row gap"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="vfSaveSteps()">Enregistrer les pas</button></div>`;openModal();document.getElementById('vf-steps-value').focus()}
function vfSaveSteps(){const field=document.getElementById('vf-steps-value'),value=Number(field.value);if(!field.value||!Number.isInteger(value)||value<0||value>200000)return toast('Indique un nombre entier entre 0 et 200 000 pas.');const next=JSON.parse(JSON.stringify(DB));next.steps[vfDateAgo(0)]=value;try{commitUserDB(next)}catch{return toast('Les pas n’ont pas pu être enregistrés.')}closeModal();render();toast('Pas enregistrés.')}
function vfCardHead(title,right='',icon=''){return `<div class="vf-card-head"><h2>${icon?ico(icon):''}${title}</h2>${right}</div>`}
function vfStat(label,value,unit,icon,detail=''){return `<div class="vf-stat">${vfIcon(icon)}<span>${label}</span><b>${typeof value==='number'?vfCount(value):esc(value)}<small>${unit}</small></b><em>${detail}</em></div>`}
function vfRings(values){return `<div class="vf-rings"><svg viewBox="0 0 200 200" role="img" aria-label="Progression des calories enregistrées, du temps d’entraînement et des habitudes">${[80,64,48].map((r,i)=>`<circle class="vf-ring-track" cx="100" cy="100" r="${r}"/><circle class="vf-ring-value ring-${i}" cx="100" cy="100" r="${r}" pathLength="100" style="--ring:${Math.max(0,Math.min(100,values[i]))}" transform="rotate(-90 100 100)"/>`).join('')}</svg><span>${ico('train')}</span></div>`}
function vfActivityCard(){const count=vfDays(vfActivityPeriod),meals=vfMeals(vfActivityPeriod),sessions=vfRecords(DB.sessions,vfActivityPeriod),minutes=Math.round(sessions.reduce((a,x)=>a+x.duration,0)/60),done=Object.entries(DB.habitLog).filter(([key,value])=>value&&key.slice(0,10)>=vfDateAgo(count-1)&&key.slice(0,10)<=vfDateAgo(0)).length,goal=Math.max(1,DB.habits.length*count);return `<section class="vf-card vf-activity">${vfCardHead('Mon activité',vfPeriod('vf-activite',vfActivityPeriod,'vfActivityRange'))}${vfRings([meals.kcal/(DB.settings.calories*count)*100,minutes/(90*count)*100,done/goal*100])}<div class="vf-ring-stats">${vfStat('Nutrition',meals.kcal,'kcal','flame',`/ ${vfNumber(DB.settings.calories*count)}`)}${vfStat('Séances',minutes,'min','train',`sur ${count} jour${count>1?'s':''}`)}${vfStat('Habitudes',done,'','habit',`/ ${goal}`)}</div></section>`}
function vfDonut(meals){const shares=macroShares(meals),has=meals.kcal>0;return `<div class="vf-donut" role="img" aria-label="${meals.kcal} kilocalories ; glucides ${shares.c} %, protéines ${shares.p} %, lipides ${shares.f} % de l’énergie" style="--donut:conic-gradient(var(--accent) 0 ${shares.c}%,var(--macro-protein) ${shares.c}% ${shares.c+shares.p}%,var(--macro-fat) ${shares.c+shares.p}% 100%);${has?'':'--donut:conic-gradient(var(--line) 0 100%);'}"><div><b>${vfCount(Math.round(meals.kcal))}</b><span>kcal</span></div></div>`}
function vfMacroCard(period=vfMacroPeriod,nutrition=false){const meals=vfMeals(period),shares=macroShares(meals);return `<section class="vf-card vf-macro">${vfCardHead('Calories & macros',nutrition?'':vfPeriod('vf-macros',period,'vfMacroRange'))}${vfDonut(meals)}<div class="vf-macro-legend">${[['Glucides',shares.c,meals.c,'carbs'],['Protéines',shares.p,meals.p,'protein'],['Lipides',shares.f,meals.f,'fat']].map(([name,pct,grams,key])=>`<div><b><i style="background:var(--macro-${key})"></i>${pct}%</b><span>${name}</span><small>${vfNumber(grams,1)} g</small></div>`).join('')}</div><p class="vf-fine">Parts de l’énergie enregistrée</p></section>`}
function vfSleepData(period=vfSleepPeriod){const days=vfDays(period),rows=Object.entries(DB.sleep).filter(([date])=>date>=vfDateAgo(days-1)&&date<=vfDateAgo(0)).map(([date,data])=>({date,...data}));return {rows,average:rows.length?rows.reduce((a,x)=>a+x.hours,0)/rows.length:0,quality:rows.length?rows.reduce((a,x)=>a+x.quality,0)/rows.length:0}}
function vfBars(values,labels,max=12,unit='h'){return `<div class="vf-bars ${values.length>7?'vf-bars-long':''}" role="group" aria-label="Historique ${unit==='h'?'du sommeil':'des calories'}">${values.map((value,i)=>`<div class="vf-bar-column"><div class="vf-bar-track"><span tabindex="0" role="img" class="vf-bar" style="--bar:${Math.min(100,Math.max(0,value)/max*100)}%;--delay:${i*50}ms" aria-label="${esc(labels[i])} : ${vfNumber(value,1)} ${unit}" data-tooltip="${vfNumber(value,1)} ${unit}"></span></div><small>${values.length<=7||i%5===0?esc(labels[i]):''}</small></div>`).join('')}</div>`}
function vfSleepCard(){const s=vfSleepData(),n=vfDays(vfSleepPeriod),dates=Array.from({length:n},(_,i)=>vfDateAgo(n-1-i)),hours=dates.map(d=>DB.sleep[d]?.hours||0),labels=dates.map(d=>new Date(d+'T12:00:00').toLocaleDateString('fr-FR',n>7?{day:'numeric',month:'numeric'}:{weekday:'short'}));const h=Math.floor(s.average),m=Math.round((s.average-h)*60);return `<section class="vf-card vf-sleep">${vfCardHead('Suivi du sommeil',vfPeriod('vf-sommeil',vfSleepPeriod,'vfSleepRange'),'moon')}<div class="vf-sleep-summary"><div><strong>${s.rows.length?`${h}<small>h</small> ${m}<small>min</small>`:'—'}</strong><span>Durée moyenne</span></div><div><span>Qualité déclarée</span><b>${s.rows.length?vfNumber(s.quality,1)+' / 5':'—'}</b></div></div>${vfBars(hours,labels)}<button class="vf-text-link" onclick="openSleepModal()">Enregistrer ma nuit ${ico('plus')}</button></section>`}
function vfPulseRecords(){return Array.isArray(DB.health?.pulse)?DB.health.pulse.filter(x=>x&&Number.isFinite(x.value)&&typeof x.date==='string'):[]}
function vfLine(values,labels){const defined=values.filter(v=>v!==null),max=Math.max(100,...defined),min=Math.max(0,Math.min(45,...defined)-10),x=i=>25+i*250/Math.max(1,values.length-1),y=v=>112-(v-min)/Math.max(1,max-min)*80;let path='',started=false;values.forEach((v,i)=>{if(v===null){started=false;return}path+=(started?'L':'M')+x(i)+' '+y(v)+' ';started=true});return `<svg class="vf-line-chart" viewBox="0 0 300 145" role="img" aria-label="Fréquence cardiaque enregistrée, ${defined.length} relevés"><path d="M25 30H280M25 70H280M25 112H280" class="vf-chart-grid"/><text x="0" y="33">${Math.round(max)}</text><text x="0" y="73">${Math.round((max+min)/2)}</text><text x="0" y="115">${min}</text>${path?`<path class="vf-chart-line" d="${path}" pathLength="1"/>`:''}${values.map((v,i)=>v===null?'':`<circle tabindex="0" cx="${x(i)}" cy="${y(v)}" r="3" class="vf-chart-point"><title>${esc(labels[i])} : ${v} BPM</title></circle>`).join('')}${labels.map((l,i)=>`<text x="${x(i)}" y="138" text-anchor="middle">${esc(l)}</text>`).join('')}</svg>`}
function vfPulseCard(){const records=vfPulseRecords(),dates=Array.from({length:7},(_,i)=>vfDateAgo(6-i)),values=dates.map(date=>records.filter(x=>x.date===date).at(-1)?.value??null),present=values.filter(x=>x!==null),avg=present.length?Math.round(present.reduce((a,b)=>a+b,0)/present.length):null;return `<section class="vf-card vf-pulse">${vfCardHead('Fréquence cardiaque','<span class="vf-fine">BPM</span>')}<div class="vf-pulse-summary"><strong>${avg===null?'—':vfCount(avg)}</strong><span>Moyenne sur 7 jours</span><span class="vf-mini-pulse">⌁⌁⌁</span></div>${vfLine(values,dates.map(d=>new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short'})))}<button class="vf-text-link" onclick="vfOpenPulse()">${present.length?'Ajouter un relevé':'Aucun relevé · Ajouter'} ${ico('plus')}</button></section>`}
function vfOpenPulse(){document.getElementById('modalbox').innerHTML=`<h2>Ajouter un relevé</h2><p class="sub">Saisie manuelle d’une mesure existante. Forge ne mesure pas ton pouls.</p><label for="vf-pulse-value">Fréquence cardiaque (BPM)</label><input id="vf-pulse-value" type="number" min="30" max="240" placeholder="Ex. 72"><label for="vf-pulse-date">Date du relevé</label><input id="vf-pulse-date" type="date" value="${vfDateAgo(0)}"><div class="row gap"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="vfSavePulse()">Enregistrer le relevé</button></div>`;openModal();document.getElementById('vf-pulse-value').focus()}
function vfSavePulse(){const value=Number(document.getElementById('vf-pulse-value').value),date=document.getElementById('vf-pulse-date').value;if(!Number.isInteger(value)||value<30||value>240||!validCalendarDay(date))return toast('Indique une date valide et une fréquence entre 30 et 240 BPM.');const next=JSON.parse(JSON.stringify(DB));next.health={...(plainRecord(next.health)?next.health:{}),pulse:[...vfPulseRecords(),{date,value}]};try{commitUserDB(next)}catch{return toast('Le relevé n’a pas pu être enregistré.')}closeModal();render();toast('Relevé enregistré.')}
function vfUpcoming(){const p=DB.programs.find(p=>p.id===DB.activeProgram)||DB.programs[0];return `<section class="vf-card vf-upcoming">${vfCardHead('Prochaines séances','<button class="vf-text-link" onclick="nav(\'program\')">Tout voir</button>')}<div class="vf-workout-list">${p?p.days.slice(0,4).map((day,i)=>`<button onclick="previewWorkout('${p.id}',${i})"><span class="vf-workout-thumb">${ico('train')}</span><span class="vf-workout-icon">${ico(i%2?'bolt':'train')}</span><span><b>${esc(day.name)}</b><small>Environ ${estDuration(day)}</small></span><em>${i===p.next?'À suivre':'Séance '+(i+1)}</em></button>`).join(''):'<p class="sub vf-empty">Choisis un programme pour retrouver tes prochaines séances.</p><button class="btn primary" onclick="nav(\'workouts\')">Choisir un programme</button>'}</div></section>`}
function vfHome(){const pulse=vfPulseRecords().at(-1)?.value??'—',habits=DB.habits.filter(h=>DB.habitLog[today()+'_'+h.id]).length,pct=Math.round(habits/Math.max(1,DB.habits.length)*100),sessions=vfRecords(DB.sessions,'week'),volume=sessions.reduce((a,x)=>a+x.volume,0);return `<div class="vf-dashboard eh"><div class="vf-top-grid"><section class="vf-card vf-hero"><div class="vf-hero-copy eh-head"><p>Bonjour, ${esc(DB.profile.name||'Membre Forge')}</p><h1>Vue d’ensemble <span>${ico('bolt')}</span></h1><p>Plus qu’une app, une discipline.<br>Une séance après l’autre, avance à ton rythme.</p></div>${vfImageSlot()}<div class="vf-hero-stats">${vfStat('Pouls',pulse,'BPM','habit',pulse==='—'?'À renseigner':'Dernier relevé')}${vfStat('Habitudes',pct,'%','bolt','Aujourd’hui')}${vfStat('Présence',loginStreak(),'j','flame','Ta série')}</div></section>${vfActivityCard()}${vfMacroCard()}</div><div class="vf-mid-grid">${vfSleepCard()}${vfPulseCard()}${vfUpcoming()}</div><div class="vf-bottom-grid">${vfStepsCard()}<section class="vf-card vf-motivation"><div><span class="vf-kicker">UN PEU PLUS LOIN, CHAQUE JOUR</span><h2>Ta discipline.<br>Ta progression. <em>Forge.</em></h2><p>Retrouve ton programme et construis la suite.</p><button class="btn primary eh-go" onclick="nav('program')">Voir mon programme ${ico('chev')}</button></div>${vfImageSlot('movement')}</section></div><section class="vf-home-tools"><button class="btn" onclick="openMealModal()">${ico('plus')} Ajouter un repas</button><button class="btn" onclick="nav('habits')">${ico('habit')} Mes habitudes</button><button class="btn" onclick="nav('goals')">${ico('goals')} Mes objectifs</button><button class="btn" onclick="nav('history')">${ico('clock')} Historique</button><button class="btn" onclick="nav('exercises')">${ico('book')} Exercices</button></section></div>`}

function vfAnimate(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const root=document.getElementById('root');root.querySelectorAll('[data-vf-count]').forEach(el=>{const to=Number(el.dataset.vfCount),places=Number(el.dataset.decimals)||0,start=performance.now();function step(now){if(!el.isConnected)return;const p=Math.min(1,(now-start)/850);el.textContent=vfNumber(to*(1-Math.pow(1-p,3)),places);if(p<1)requestAnimationFrame(step)}requestAnimationFrame(step)});}

iv></div>`};

function vfProgressPhotos(){const photos=DB.photos.slice().sort((a,b)=>a.date.localeCompare(b.date)),pair=photos.length>1?[photos[0],photos.at(-1)]:photos;return `<section class="vf-card vf-progress-photos">${vfCardHead('Photos de progression','<button class="vf-text-link" onclick="nav(\'beforeafter\')">Comparer</button>')}<div class="vf-photo-pair">${pair.length?pair.map(p=>`<figure><img src="${p.data}" alt="${esc(p.caption||'Souvenir Forge')}"><figcaption>${fmtDate(p.date)}</figcaption></figure>`).join(''):'<div class="vf-photo-empty">'+ico('photo')+'<p>Ajoute tes photos pour suivre ton parcours.</p></div>'}</div><button class="btn" onclick="nav('memories')">Mes souvenirs</button></section>`}
pages.progress=function(){return vfSavedProgress().replace('class="r-page"','class="r-page vf-progress-page"').replace('<section class="eh-card rise" style="--i:3">',vfProgressPhotos()+'<section class="eh-card rise" style="--i:3">')};
</script>
<script>/* FORGE — Démarrage de l’application */
render();
/* Écran d’intro « fond live » (une fois par session, ignorable d’un tap, désactivé si animations réduites) */
(function splash(){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 try{if(sessionStorage.getItem('forgeSplash'))return;sessionStorage.setItem('forgeSplash','1')}catch(e){}
 const d=document.createElement('div');d.className='splash';d.setAttribute('aria-hidden','true');
 d.innerHTML='<div class="sp-brand"><span class="logo-f">F</span>FORGE</div><div class="sp-txt"><h2>DISCIPLINE.<br>PROGRESSION.<br>LIBERTÉ.</h2><i></i></div><p>Plus qu’une app,<br>une discipline.</p>';
 document.body.appendChild(d);
 const off=()=>{d.classList.add('out');setTimeout(()=>d.remove(),500)};d.addEventListener('click',off);setTimeout(off,800);
})();

/* Le brouillon est déjà écrit à chaque saisie ; ces événements couvrent les transitions de page. */
window.addEventListener('pagehide',()=>persistWorkoutDraft());
document.addEventListener('visibilitychange',()=>{if(session){if(document.hidden)persistWorkoutDraft();else restStep()}});
</script>
